<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lit;src:url(file:///tmp/Literata.ttf)}

*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#17183A;font-family:Inter,sans-serif;color:#fff}
#bg{position:absolute;inset:0;background:radial-gradient(820px 640px at 88% 6%,#6A49E2aa,transparent 68%),radial-gradient(760px 760px at -5% 70%,#5A3B8C88,transparent 70%),radial-gradient(600px 500px at 100% 100%,#A891F733,transparent 70%),linear-gradient(180deg,#17183A,#2A1E4D 55%,#17183A)}
#rain{position:absolute;left:80px;top:290px;display:flex;gap:8px}#rain i{width:44px;height:8px;border-radius:9px}
.glow{position:absolute;border-radius:50%;filter:blur(60px)}
#top{position:absolute;left:80px;top:170px;display:flex;align-items:center;gap:22px}
#top svg{width:92px;height:92px;border-radius:24px;box-shadow:0 10px 30px #0008}
#top b{display:block;font-family:Lit;font-size:40px;font-weight:700}
#top span{display:block;font-size:20px;letter-spacing:6px;font-weight:800;color:#A891F7;margin-top:6px}
#chip{position:absolute;left:80px;top:340px;display:flex;gap:14px}
#chip i{font-style:normal;font-size:26px;font-weight:800;padding:10px 22px;border-radius:99px;background:#ffffff14;border:1.5px solid #ffffff24;color:#C9C2E3;letter-spacing:1px}
#chip i.a{background:#2E9E6A;border-color:#2E9E6A;color:#fff}
#title{position:absolute;left:80px;right:80px;top:430px;font-family:Lit;font-weight:700;font-size:96px;line-height:1.05;letter-spacing:-1px}
#title em{color:#E9C46A;font-style:italic}
#card{position:absolute;left:60px;right:60px;top:660px;min-height:500px;padding:54px 56px 50px;border-radius:44px;background:linear-gradient(160deg,#6A49E233,#ffffff0a 60%);border:1.5px solid #A891F755;box-shadow:0 30px 80px #0007;backdrop-filter:blur(8px)}
#en{font-family:Lit;font-size:70px;line-height:1.38;font-weight:600}
#en span{display:inline-block;padding:0 10px;margin:0 -4px;border-radius:16px;transition:none;opacity:.38}
#en span.done{opacity:1}
#en span.now{opacity:1;background:#E9C46A;color:#17183A}
#hy{margin-top:34px;padding-top:30px;border-top:1.5px solid #A891F740;font-family:Hy;font-size:42px;line-height:1.4;color:#E4DEFA}
#hy small{display:block;font-family:Inter;font-size:20px;letter-spacing:5px;font-weight:800;color:#A891F7;margin-bottom:10px}
#en span.key{box-shadow:inset 0 -6px 0 #A891F7aa}#en span.now.key{box-shadow:none}
#words{position:absolute;left:80px;right:80px;top:700px}#words h4{font-size:24px;letter-spacing:6px;font-weight:800;color:#A891F7;margin-bottom:26px}
#words div{display:flex;align-items:center;justify-content:space-between;padding:26px 34px;margin-bottom:18px;border-radius:30px;background:#ffffff10;border:1.5px solid #A891F744}
#words b{font-family:Lit;font-size:58px}#words span{font-family:Hy;font-size:40px;color:#E9C46A}
#dots{position:absolute;left:0;right:0;top:1230px;display:flex;justify-content:center;gap:14px}
#dots i{width:16px;height:16px;border-radius:99px;background:#ffffff26}
#dots i.on{width:56px;background:#E9C46A}
#dots i.done{background:#A891F7}
#wave{position:absolute;left:80px;right:80px;top:1290px;height:60px;display:flex;align-items:center;gap:8px;justify-content:center}
#wave b{width:10px;border-radius:9px;background:#A891F7}
#bar{position:absolute;left:0;top:0;height:8px;background:linear-gradient(90deg,#6A49E2,#A891F7,#E9C46A)}
#out{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;background:radial-gradient(700px 700px at 50% 38%,#6A49E2,#2A1E4D 55%,#17183A 80%)}
#out .cta{display:flex;gap:16px;margin-top:40px}#out .cta i{font-style:normal;font-size:30px;font-weight:800;padding:16px 30px;border-radius:99px;background:#ffffff14;border:1.5px solid #A891F766}#out .cta i.g{background:#E9C46A;color:#17183A;border-color:#E9C46A}
#out svg{width:190px;height:190px;border-radius:46px;box-shadow:0 20px 60px #0009}
#out h2{font-family:Lit;font-size:92px;margin-top:50px}
#out h2 em{color:#E9C46A}
#out p{font-size:34px;color:#E4DEFA;margin-top:22px;font-weight:600}
#out .n{margin-top:60px;font-family:Lit;font-style:italic;font-size:46px}
#out .r{font-size:22px;letter-spacing:6px;font-weight:800;color:#A891F7;margin-top:12px}
</style></head><body><div id="bg"></div><div id="bar"></div>

<path class="st" style="--i:2" d="M88 54 C162 62 222 98 250 158 L252 222 C226 166 170 128 88 116 Z" fill="#9378F2" stroke="#17183A" stroke-width="12" paint-order="stroke"/>
<path class="st" style="--i:1" d="M60 124 C134 130 204 164 240 222 L252 428 C210 370 140 334 60 318 Z" fill="#A891F7" stroke="#17183A" stroke-width="14" paint-order="stroke"/></g><g transform="translate(512 0) scale(-1 1)"><path class="st" style="--i:0" d="M10 150 L40 164 L40 336 C112 344 196 372 252 446 L252 470 C190 404 108 382 10 376 Z" fill="#5B3DD8"/>
<path class="st" style="--i:2" d="M88 54 C162 62 222 98 250 158 L252 222 C226 166 170 128 88 116 Z" fill="#7B5DEB" stroke="#17183A" stroke-width="12" paint-order="stroke"/>
<path class="st" style="--i:1" d="M60 124 C134 130 204 164 240 222 L252 428 C210 370 140 334 60 318 Z" fill="#8C70F2" stroke="#17183A" stroke-width="14" paint-order="stroke"/></g></g></svg><div><b>Gayane Torosyan</b><span>ENGLISH READING ROOM</span></div></div>
<div id="rain"><i style="background:#B23F78"></i><i style="background:#7A4FD6"></i><i style="background:#3E5FD9"></i><i style="background:#1C8AA3"></i><i style="background:#2E9E6A"></i><i style="background:#E8A317"></i></div><div id="chip"><i class="a">A1</i><i>SHORT STORY</i><i>PART 1</i></div>
<div id="title">A Day at<br>the <em>Zoo</em></div>
<div id="words"><h4>NEW WORDS · ՆՈՐ ԲԱՌԵՐ</h4><div><b>sky</b><span>երկինք</span></div><div><b>lazy</b><span>ծույլ</span></div><div><b>monkeys</b><span>կապիկներ</span></div></div><div id="card"><div id="en"></div><div id="hy"><small>ՀԱՅԵՐԵՆ</small><span id="hyt"></span></div></div>

<path class="st" style="--i:2" d="M88 54 C162 62 222 98 250 158 L252 222 C226 166 170 128 88 116 Z" fill="#9378F2" stroke="#17183A" stroke-width="12" paint-order="stroke"/>
<path class="st" style="--i:1" d="M60 124 C134 130 204 164 240 222 L252 428 C210 370 140 334 60 318 Z" fill="#A891F7" stroke="#17183A" stroke-width="14" paint-order="stroke"/></g><g transform="translate(512 0) scale(-1 1)"><path class="st" style="--i:0" d="M10 150 L40 164 L40 336 C112 344 196 372 252 446 L252 470 C190 404 108 382 10 376 Z" fill="#5B3DD8"/>
<path class="st" style="--i:2" d="M88 54 C162 62 222 98 250 158 L252 222 C226 166 170 128 88 116 Z" fill="#7B5DEB" stroke="#17183A" stroke-width="12" paint-order="stroke"/>
<path class="st" style="--i:1" d="M60 124 C134 130 204 164 240 222 L252 428 C210 370 140 334 60 318 Z" fill="#8C70F2" stroke="#17183A" stroke-width="14" paint-order="stroke"/></g></g></svg><h2>Part 2 <em>tomorrow</em></h2><p>Read · Listen · Learn</p><div class="cta"><i class="g">Follow</i><i>Save 📌</i><i>Share ✈️</i></div><div class="n">Gayane Torosyan</div><div class="r">ENGLISH READING ROOM</div></div>
<script>
const D={"s": [{"w": [["Today", 4.02, 4.46], ["is", 4.47, 4.63], ["Saturday,", 4.64, 5.3], ["and", 5.55, 5.67], ["my", 5.68, 5.84], ["family", 5.85, 6.38], ["is", 6.39, 6.59], ["at", 6.6, 6.73], ["the", 6.75, 6.84], ["zoo.", 6.85, 7.29]], "hy": "Այսօր շաբաթ է, և իմ ընտանիքը կենդանաբանական այգում է։"}, {"w": [["The", 7.71, 7.82], ["sun", 7.83, 8.09], ["is", 8.11, 8.25], ["hot,", 8.26, 8.71], ["and", 8.97, 9.07], ["the", 9.08, 9.19], ["sky", 9.2, 9.51], ["is", 9.53, 9.72], ["blue.", 9.74, 10.19]], "hy": "Արևը տաք է, իսկ երկինքը՝ կապույտ։"}, {"w": [["First,", 10.59, 11.19], ["we", 11.44, 11.55], ["look", 11.57, 11.8], ["at", 11.82, 11.92], ["the", 11.94, 12.03], ["lions.", 12.04, 12.75]], "hy": "Սկզբում նայում ենք առյուծներին։"}, {"w": [["They", 13.17, 13.36], ["are", 13.37, 13.47], ["big,", 13.49, 13.94], ["but", 14.21, 14.37], ["they", 14.38, 14.53], ["are", 14.54, 14.62], ["very", 14.63, 14.97], ["lazy.", 14.99, 15.54]], "hy": "Նրանք մեծ են, բայց շատ ծույլ։"}, {"w": [["They", 15.96, 16.09], ["sleep", 16.11, 16.5], ["in", 16.51, 16.63], ["the", 16.65, 16.75], ["sun", 16.76, 17.17], ["all", 17.19, 17.4], ["day!", 17.41, 17.79]], "hy": "Նրանք ամբողջ օրը քնում են արևի տակ։"}, {"w": [["Next,", 18.17, 18.75], ["we", 19.0, 19.13], ["go", 19.15, 19.36], ["to", 19.37, 19.47], ["the", 19.49, 19.58], ["monkeys.", 19.59, 20.32]], "hy": "Հետո գնում ենք կապիկների մոտ։"}], "end": 20.32}, END=D.end, TOTAL=END+2.6;
const en=document.getElementById('en'), hyt=document.getElementById('hyt'), dots=document.getElementById('dots'), wave=document.getElementById('wave');
dots.innerHTML=D.s.map(()=>'<i></i>').join(''); wave.innerHTML=Array.from({length:40},()=>'<b></b>').join('');
let curS=-1;
const ease=x=>1-Math.pow(1-x,3), cl=x=>Math.max(0,Math.min(1,x));
function seek(t){
  document.getElementById('bar').style.width=(cl(t/TOTAL)*1080)+'px';
  // intro: title slides in
  const ti=ease(cl(t/0.8)); const tt=document.getElementById('title'); tt.style.opacity=ti; tt.style.transform=`translateY(${(1-ti)*40}px)`;
  const ch=ease(cl((t-0.3)/0.6)); document.getElementById('chip').style.opacity=ch;
  const card=document.getElementById('card'), c=ease(cl((t-3.2)/0.7)); card.style.opacity=c; card.style.transform=`translateY(${(1-c)*60}px) scale(${0.96+0.04*c})`;
  let si=0; for(let i=0;i<D.s.length;i++) if(t>=D.s[i].w[0][1]-0.25) si=i;
  if(si!==curS){ curS=si; en.innerHTML=D.s[si].w.map(w=>`<span data-k="${/^(sky|lazy|monkeys)/i.test(w[0])?1:''}">${w[0]}</span>`).join(' '); hyt.textContent=D.s[si].hy; }
  const spans=en.children; D.s[si].w.forEach((w,k)=>{ spans[k].className=(t>=w[2]?'done':(t>=w[1]-0.03?'now':''))+(spans[k].dataset.k?' key':''); });
  const st=D.s[si].w[0][1]-0.25, hyo=ease(cl((t-st-0.35)/0.5)); document.getElementById('hy').style.opacity=t<3.2?0:hyo;
  [...dots.children].forEach((d,i)=>d.className=i<si?'done':(i===si?'on':'')); dots.style.opacity=c;
  const wd=document.getElementById('words'); const wi=ease(cl((t-0.7)/0.6)), wo=cl((t-2.9)/0.35); wd.style.opacity=wi*(1-wo); wd.style.transform=`translateY(${(1-wi)*40}px)`; [...wd.children].forEach((x,i)=>{ if(i){ const e=ease(cl((t-0.8-i*0.25)/0.5)); x.style.opacity=e; x.style.transform=`translateX(${(1-e)*-60}px)`; } });
  const talking=D.s.some(s=>s.w.some(w=>t>=w[1]&&t<=w[2]));
  [...wave.children].forEach((b,i)=>{ const a=talking?(0.35+0.65*Math.abs(Math.sin(t*9+i*0.7)*Math.cos(t*4.3+i*0.31))):0.12; b.style.height=(8+a*52)+'px'; b.style.opacity=t<3.2?0:0.9; });
  const o=ease(cl((t-END-0.3)/0.6)); const out=document.getElementById('out'); out.style.opacity=o; out.style.transform=`scale(${1.04-0.04*o})`;
}
window.seek=seek; seek(0);
</script></body></html>
