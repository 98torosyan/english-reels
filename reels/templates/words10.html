<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <link rel="icon" href="data:,">
 <style>
 @font-face{font-family:Inter;src:url("__INTER_FONT__") format("woff2");font-weight:100 900;font-display:block}
 @font-face{font-family:IPA;src:url("__INTER_FONT__") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0000-00FF}
 @font-face{font-family:IPA;src:url("__INTER_EXT_FONT__") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0100-02FF}
 @font-face{font-family:IPA;src:url("__INTER_GREEK_FONT__") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0370-03FF}
 @font-face{font-family:Literata;src:url("__LITERATA_FONT__") format("woff2");font-weight:100 900;font-display:block}
 @font-face{font-family:NotoArmenian;src:url("__ARMENIAN_FONT__") format("woff2");font-weight:100 900;font-display:block}
 *{box-sizing:border-box;margin:0}
 html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif}
 .header{position:absolute;top:100px;left:82px;right:82px;display:flex;align-items:center;gap:22px}
 .logo{width:84px;height:84px;border-radius:22px}
 .brand-name{font:700 34px Literata,serif;letter-spacing:-.5px}
 .brand-sub{margin-top:6px;font-size:20px;font-weight:800;letter-spacing:5px}
 .header .handle{margin-left:auto;font:800 24px Inter;letter-spacing:2px;color:var(--c)}
 .eyebrow{position:absolute;top:236px;left:82px;right:82px;display:flex;align-items:center;justify-content:space-between;font:800 26px Inter;letter-spacing:5px}
 .eyebrow span{font:700 24px Inter;letter-spacing:3px;padding:6px 20px;border-radius:99px}
 .title{position:absolute;top:322px;left:82px;right:82px}
 .title h1{font:700 96px/1.02 Literata,serif;letter-spacing:-2px}
 .title h1 em{color:var(--c);font-style:italic}
 .big10{position:absolute;right:90px;top:318px;font:italic 700 230px/1 Literata,serif;color:var(--c);opacity:.08;letter-spacing:-8px}
 .cnt{font:italic 600 30px Literata,serif;letter-spacing:0;color:var(--muted);margin-left:8px}
 body.story .progress,body.story .outro,body.story .header{display:none}
 .row:nth-child(even):not(.on){background:#17183A05}
 .title .t-hy{margin-top:14px;font:500 38px NotoArmenian,sans-serif;color:var(--muted)}
 .list{position:absolute;top:548px;left:62px;right:62px}
 .row{position:relative;height:94px;display:grid;grid-template-columns:62px 1fr auto;align-items:center;column-gap:14px;padding:0 26px;border-bottom:1.5px solid var(--line);border-radius:18px}
 .row .n{font:italic 600 32px Literata,serif;color:var(--soft)}
 .row .ic{display:flex;align-items:center;justify-content:center;width:62px;height:62px;color:var(--c)}
 .row .ic svg{width:56px;height:56px}
 .row .en{font:700 48px/1 Literata,serif;color:var(--ink);white-space:nowrap}
 .row .ipa{margin-left:16px;font:500 30px IPA,sans-serif;color:var(--c);white-space:nowrap}
 .row .hy{font:500 34px NotoArmenian,sans-serif;color:var(--muted);text-align:right;white-space:nowrap}
 .row .bg{position:absolute;inset:0;border-radius:18px;background:var(--card);border:2px solid var(--c);box-shadow:0 16px 36px #3a2f1418;opacity:0}
 .row>*:not(.bg){position:relative}
 .row .wv{position:absolute;left:18px;top:34px;display:flex;gap:5px;align-items:flex-end;height:26px;opacity:0}
 .row .wv i{display:block;width:5px;border-radius:6px;background:var(--c)}
 .say{position:absolute;left:82px;right:82px;top:1520px;display:flex;align-items:center;justify-content:center;gap:16px;font:800 26px Inter;letter-spacing:4px;color:var(--c)}
 .say em{font:600 28px NotoArmenian,sans-serif;font-style:normal;letter-spacing:0;color:var(--muted)}
 .foot{position:absolute;left:82px;right:82px;bottom:190px;display:flex;justify-content:space-between;font-size:26px;font-weight:700}
 .progress{position:absolute;left:82px;right:82px;bottom:140px;height:7px;border-radius:99px;overflow:hidden}
 .progress i{display:block;height:100%;width:0}
 .outro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;opacity:0}
 .outro img{width:170px;height:170px;border-radius:42px}
 .outro h2{margin-top:44px;font:700 82px/1.06 Literata,serif}
 .outro p{margin-top:22px;font:600 38px NotoArmenian,Inter,sans-serif}
 .save{margin-top:46px;padding:16px 34px;border-radius:99px;font-size:34px;font-weight:800}
 .follow{margin-top:26px;font:700 30px NotoArmenian,Inter,sans-serif}
 .signature{margin-top:58px;font-size:24px;font-weight:800;letter-spacing:5px}
 </style>
</head>
<body>
 <header class="header" id="hd"><img class="logo" src="__LOGO_DATA__" alt=""><div><div class="brand-name">Gayane Torosyan</div><div class="brand-sub">ENGLISH READING ROOM</div></div><div class="handle">@english.readingroom</div></header>
 <div class="eyebrow" id="eyebrow"><b id="series"></b><span id="level" class="chip"></span></div>
 <div class="big10" id="big10">10</div><div class="title" id="title"><h1 id="theme"></h1><div class="t-hy" id="themeHy"></div></div>
 <div class="list" id="list"></div>
 <div class="say" id="say"><span id="sayEn">LISTEN AND REPEAT</span> <em id="sayHy">· Լսի՛ր և կրկնի՛ր</em><span class="cnt" id="cnt"></span></div>
 <footer class="foot"><span>Save it · Share it</span><span class="handle">@english.readingroom</span></footer>
 <div class="progress"><i id="progress"></i></div>
 <section id="outro" class="outro"><img id="outroLogo" src="__LOGO_DATA__" alt=""><h2>Save it · <em>share it</em></h2><p>Պահի՛ր և ուղարկի՛ր ընկերոջդ</p><span class="save" id="saveChip">Save</span><span class="follow">Անհատական և խմբային դասեր · գրե՛ք Direct-ով</span><span class="signature">@ENGLISH.READINGROOM</span></section>
 <script>
 const clamp=x=>Math.max(0,Math.min(1,x)), ease=x=>1-Math.pow(1-x,3), lerp=(a,b,x)=>a+(b-a)*x;
 const back=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
 let D=null,T=null;
 window.configure=(data,timeline)=>{D=data;T=timeline;
  series.textContent=`10 WORDS · ${String(data.number).padStart(2,'0')}`;
  level.textContent=data.level; const tw=data.theme.split(' '); theme.innerHTML=tw.length>1?tw.slice(0,-1).join(' ')+' <em>'+tw.at(-1)+'</em>':'<em>'+data.theme+'</em>';
  if(data.color) document.documentElement.style.setProperty('--c',data.color);
  if(data.story){document.body.classList.add('story');sayEn.textContent='LISTEN IN OUR REELS';sayHy.textContent='· Ձայնով՝ մեր Reels-ում';} themeHy.textContent=data.theme_hy;
  list.innerHTML=data.words.map((w,i)=>`<div class="row" id="r${i}"><div class="bg"></div>${w.svg?`<span class="ic">${w.svg}</span>`:`<span class="n">${i+1}</span>`}<span><span class="en">${w.en}</span><span class="ipa">${w.ipa}</span></span><span class="hy">${w.hy}</span><div class="wv">${'<i></i>'.repeat(5)}</div></div>`).join('');
 };
 window.fit=()=>{document.querySelectorAll('.row').forEach(r=>{const en=r.querySelector('.en'),ip=r.querySelector('.ipa'),hy=r.querySelector('.hy');let f=48,g=30;
  while(ip.getBoundingClientRect().right>hy.getBoundingClientRect().left-28&&f>34){f-=2;g=Math.max(24,g-1);en.style.fontSize=f+'px';ip.style.fontSize=g+'px';}})};
 window.seek=t=>{
  progress.style.width=(clamp(t/T.total)*100)+'%';
  const a=ease(clamp(t/.45)); eyebrow.style.opacity=a; eyebrow.style.transform=`translateX(${(1-a)*-30}px)`;
  const b=ease(clamp((t-.1)/.55)); title.style.opacity=b; title.style.transform=`translateY(${(1-b)*50}px)`;
  const s=ease(clamp((t-1.4)/.5)); say.style.opacity=s;
  const g=ease(clamp((t-.2)/.9)); big10.style.opacity=.08*g; big10.style.transform=`translateY(${(1-g)*40}px)`;
  const cur=T.rows.findIndex(p=>t>=p.at&&t<p.end); cnt.textContent=cur>=0?` ${cur+1}/10`:'';
  D.words.forEach((w,i)=>{const r=document.getElementById('r'+i);
   const e=clamp((t-.45-i*.09)/.5);
   const p=T.rows[i]; const on=t>=p.at&&t<p.end; const k=on?ease(clamp((t-p.at)/.25)):(t>=p.end?Math.max(0,1-clamp((t-p.end)/.3)):0);
   r.style.opacity=ease(e); r.style.transform=`translateX(${(1-ease(e))*-60}px) scale(${1+.03*k})`;
   r.querySelector('.bg').style.opacity=k;
   const sp=t>=p.v0&&t<=p.v1; const wv=r.querySelector('.wv'); const ic=r.querySelector('.ic'); if(ic){wv.style.opacity=0; ic.style.transform=`scale(${1+.18*k}) translateY(${sp?-4*Math.abs(Math.sin(t*9)):0}px) rotate(${sp?6*Math.sin(t*12):0}deg)`;} else {wv.style.opacity=k; r.querySelector('.n').style.opacity=1-k;}
   wv.querySelectorAll('i').forEach((x,j)=>x.style.height=(sp?8+18*Math.abs(Math.sin(t*13+j*.9)):6)+'px');
  });
  const o=ease(clamp((t-(T.total-2.2))/.8)); outro.style.opacity=o; outro.style.transform=`scale(${1.03-.03*o})`;
  const o2=clamp((t-(T.total-2.2))/.8);
  outroLogo.style.transform=`scale(${back(clamp(o2*1.4))})`; saveChip.style.transform=`scale(${back(clamp(o2*1.6-.3))})`;
 };
 </script>
</body>
</html>
