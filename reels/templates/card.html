<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <style>
    @font-face{font-family:Inter;src:url("__INTER_FONT__") format("woff2");font-style:normal;font-weight:100 900;font-display:block}
    @font-face{font-family:Literata;src:url("__LITERATA_FONT__") format("woff2");font-style:normal;font-weight:100 900;font-display:block}
    @font-face{font-family:NotoArmenian;src:url("__ARMENIAN_FONT__") format("woff2");font-style:normal;font-weight:100 900;font-display:block}
    *{box-sizing:border-box;margin:0}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#17183A;color:#fff;font-family:Inter,sans-serif}
    body{position:relative;background:radial-gradient(800px 650px at 90% 5%,#6A49E2aa,transparent 68%),radial-gradient(750px 800px at -10% 65%,#5A3B8C88,transparent 70%),linear-gradient(165deg,#17183A 5%,#2A1E4D 58%,#17183A)}
    .grain{position:absolute;inset:0;opacity:.11;background-image:radial-gradient(#fff 0.65px,transparent .65px);background-size:8px 8px;mask-image:linear-gradient(180deg,transparent,#000 25%,#000 80%,transparent)}
    .header{position:absolute;top:105px;left:82px;right:82px;display:flex;align-items:center;gap:24px}
    .logo{width:96px;height:96px;border-radius:27px;box-shadow:0 14px 36px #08061588}
    .brand-name{font-family:Literata,serif;font-size:38px;font-weight:700;letter-spacing:-.7px}
    .brand-sub{margin-top:7px;color:#A891F7;font-size:22px;font-weight:800;letter-spacing:5px}
    .rainbow{position:absolute;top:245px;left:84px;display:flex;gap:8px}
    .rainbow i{display:block;width:42px;height:8px;border-radius:8px}
    .eyebrow{position:absolute;top:300px;left:84px;color:#A891F7;font-size:30px;letter-spacing:5px;font-weight:800;text-transform:uppercase}
    .headline{position:absolute;top:385px;left:82px;right:82px;font:700 84px/1.12 Literata,serif;letter-spacing:-1.3px}
    .headline .gold{color:#E9C46A;font-style:italic}
    .panel{position:absolute;top:640px;left:62px;right:62px;min-height:620px;padding:58px 58px 54px;border-radius:42px;background:linear-gradient(155deg,#6A49E233,#ffffff0a 58%);border:1.5px solid #A891F755;box-shadow:0 30px 80px #07061588}
    .panel-label{font-family:Inter,sans-serif;font-size:27px;letter-spacing:5px;color:#A891F7;font-weight:800;text-transform:uppercase}
    .panel-label-hy{font-family:NotoArmenian,sans-serif;font-size:.95em;letter-spacing:0;text-transform:none}
    .wrong{margin-top:34px;padding:30px 34px;border:1.5px solid #B23F7899;border-radius:27px;background:#B23F781f;color:#F3DCE7;font:600 50px/1.24 Literata,serif}
    .wrong .mark{color:#E07AA8;font:800 32px Inter,sans-serif;margin-right:12px}
    .correct{margin-top:24px;padding:30px 34px;border:1.5px solid #2E9E6Aaa;border-radius:27px;background:#2E9E6A22;font:600 52px/1.28 Literata,serif;opacity:0;transform:translateY(18px)}
    .correct .mark{color:#57D79A;font:800 32px Inter,sans-serif;margin-right:12px}
    .correct-word{opacity:.55;padding:0 3px;border-radius:8px}
    .correct-word.done{opacity:1}
    .correct-word.now{opacity:1;background:#E9C46A;color:#17183A}
    .correct-word.fix{opacity:1;color:#E9C46A;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:9px}
    .correct-word.fix.now{color:#17183A}
    .armenian{position:absolute;top:1340px;left:88px;right:88px;text-align:center;font:500 44px/1.45 NotoArmenian,sans-serif;color:#E4DEFA}
    .countdown{position:absolute;top:1330px;left:0;right:0;text-align:center;font:800 130px/1.2 Literata,serif;color:#E9C46A;opacity:0}
    .timer-label{margin-top:14px;font:800 20px/1.2 Inter,sans-serif;letter-spacing:5px;color:#A891F7}
    .word{font:700 116px/1.0 Literata,serif;color:#E9C46A;text-align:center;margin-top:40px}
    .word-meta{text-align:center;color:#A891F7;font:800 24px/1.2 Inter,sans-serif;letter-spacing:6px;text-transform:uppercase;margin-top:22px}
    .word-hy{text-align:center;color:#E4DEFA;font:600 50px/1.25 NotoArmenian,sans-serif;margin-top:28px}
    .example{margin-top:44px;text-align:center;font:600 45px/1.38 Literata,serif}
    .example-hy{margin-top:25px;text-align:center;font:500 34px/1.42 NotoArmenian,sans-serif;color:#E4DEFA}
    .foot{position:absolute;left:82px;right:82px;bottom:190px;display:flex;align-items:center;justify-content:space-between;color:#C9C2E3;font-size:26px;font-weight:700}
    .foot .handle{letter-spacing:3px;color:#A891F7;font-weight:800}
    .progress{position:absolute;left:82px;right:82px;bottom:140px;height:7px;border-radius:99px;background:#ffffff24;overflow:hidden}
    .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6A49E2,#A891F7,#E9C46A)}
    .outro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(680px 640px at 50% 42%,#6A49E2,#2A1E4D 56%,#17183A 82%);opacity:0;transform:scale(1.03)}
    .outro img{width:170px;height:170px;border-radius:42px;box-shadow:0 20px 60px #0009}
    .outro h2{margin-top:44px;font:700 82px/1.06 Literata,serif}
    .outro h2 em{color:#E9C46A}
    .outro p{margin-top:22px;color:#E4DEFA;font-size:40px;font-weight:600}
    .save{margin-top:46px;padding:16px 34px;border-radius:99px;background:#E9C46A;color:#17183A;font-size:36px;font-weight:800}
    .signature{margin-top:58px;color:#A891F7;font-size:24px;font-weight:800;letter-spacing:5px}
    body[data-kind="quiz"] .armenian{top:1530px;font-size:36px;opacity:0;transition:none}
    body[data-kind="mistake"] .panel{min-height:0}
    body[data-kind="quiz"] .correct{font-size:42px;padding:22px 30px}
    body[data-kind="mistake"] .armenian{top:1230px}
    .option.ok{border-color:#5CC491!important;background:#2E9E6A33!important;color:#fff!important}
    .option.ok::after{content:"  ✓";color:#5CC491;font-family:Inter,sans-serif;font-weight:800}
    #save[hidden]{display:none}
    /* ---------- motion layer ---------- */
    .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
    .blob.b1{width:760px;height:760px;background:#6A49E2;left:520px;top:-180px}
    .blob.b2{width:620px;height:620px;background:#5A3B8C;left:-260px;top:980px;opacity:.45}
    .blob.b3{width:520px;height:520px;background:#A891F7;left:640px;top:1420px;opacity:.12}
    #dust{position:absolute;inset:0;pointer-events:none}
    #dust i{position:absolute;width:6px;height:6px;border-radius:50%;background:#C9C2E3}
    .headline .ln{display:block;will-change:transform}
    .swoosh{position:absolute;left:0;bottom:-18px;width:100%;height:26px;overflow:visible}
    .swoosh path{fill:none;stroke:#E9C46A;stroke-width:7;stroke-linecap:round}
    .gold{position:relative;display:inline-block}
    .ring{position:absolute;left:50%;top:1300px;width:260px;height:260px;margin-left:-130px;opacity:0}
    .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
    .ring circle{fill:none;stroke-width:14}
    .ring .trk{stroke:#ffffff1f}.ring .arc{stroke:url(#ringGrad);stroke-linecap:round}
    .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 128px/1 Literata,serif;color:#E9C46A}
    #confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    #confetti i{position:absolute;display:block;border-radius:3px}
    .strike{position:absolute;left:84px;right:34px;top:50%;height:6px;border-radius:6px;background:#E07AA8;transform-origin:left center;transform:scaleX(0)}
    .wrong{position:relative}
    .check{display:inline-block;width:46px;height:46px;vertical-align:-8px;margin-right:12px}
    .check path{fill:none;stroke:#5CC491;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
    .outro .rays{position:absolute;left:50%;top:42%;width:1400px;height:1400px;margin:-700px 0 0 -700px;background:repeating-conic-gradient(#ffffff0c 0 6deg,transparent 6deg 18deg);border-radius:50%;mask-image:radial-gradient(circle,#000 20%,transparent 62%)}
    .outro>*{position:relative}
    .follow{margin-top:22px;color:#fff;font-size:30px;font-weight:700;opacity:.9}

  </style>
</head>
<body>
  <div class="blob b1" id="b1"></div><div class="blob b2" id="b2"></div><div class="blob b3" id="b3"></div><div id="dust"></div>
  <header class="header"><img class="logo" src="__LOGO_DATA__" alt=""><div><div class="brand-name">Gayane Torosyan</div><div class="brand-sub">ENGLISH READING ROOM</div></div></header>
  <div class="rainbow"><i style="background:#B23F78"></i><i style="background:#7A4FD6"></i><i style="background:#3E5FD9"></i><i style="background:#1C8AA3"></i><i style="background:#2E9E6A"></i><i style="background:#E8A317"></i></div>
  <div id="eyebrow" class="eyebrow"></div>
  <h1 id="headline" class="headline"></h1>
  <main id="panel" class="panel"></main>
  <div id="countdown" class="countdown"></div><div id="ring" class="ring"><svg viewBox="0 0 260 260"><defs><linearGradient id="ringGrad"><stop offset="0" stop-color="#A891F7"/><stop offset="1" stop-color="#E9C46A"/></linearGradient></defs><circle class="trk" cx="130" cy="130" r="112"/><circle id="arc" class="arc" cx="130" cy="130" r="112" stroke-dasharray="704" stroke-dashoffset="704"/></svg><b id="ringNum">3</b></div><div id="confetti"></div>
  <div id="armenian" class="armenian"></div>
  <footer class="foot"><span>Let's read together</span><span class="handle">@english.readingroom</span></footer>
  <div class="progress"><i id="progress"></i></div>
  <section id="outro" class="outro"><div class="rays" id="rays"></div><img id="outroLogo" src="__LOGO_DATA__" alt=""><h2>Read · Listen · <em>Learn</em></h2><p>Small steps, big English.</p><span class="save" id="saveChip">Save 📌</span><span class="follow" id="followTxt">Full lessons with audio · link in bio</span><span class="signature">GAYANE TOROSYAN · ENGLISH READING ROOM</span></section>
  <script>
    const clamp=x=>Math.max(0,Math.min(1,x));
    const ease=x=>1-Math.pow(1-x,3);

    const RV=()=>window.REVEAL_AT||3.35;
    const lerp=(a,b,x)=>a+(b-a)*x;
    const back=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
    const rnd=(()=>{let s=7;return()=>{s=(s*16807)%2147483647;return s/2147483647}})();
    const DUST=[...Array(14)].map(()=>({x:rnd()*1080,y:rnd()*1920,r:2+rnd()*5,v:12+rnd()*28,p:rnd()*6.28,o:.08+rnd()*.22}));
    const CONF=[...Array(70)].map(()=>({a:rnd()*Math.PI*2,v:500+rnd()*900,w:10+rnd()*12,h:6+rnd()*10,c:['#E9C46A','#F2C86B','#A891F7','#C9C2E3','#6A49E2','#fff'][Math.floor(rnd()*6)],sp:(rnd()-.5)*900}));
    function motionSetup(){
      const d=document.getElementById('dust'); d.innerHTML=DUST.map(()=>'<i></i>').join('');
      document.getElementById('confetti').innerHTML=CONF.map(c=>`<i style="width:${c.w}px;height:${c.h}px;background:${c.c};opacity:0"></i>`).join('');
      const h=document.getElementById('headline');
      h.innerHTML=h.innerHTML.split('<br>').map(l=>`<span class="ln">${l}</span>`).join('');
      const g=h.querySelector('.gold'); if(g) g.insertAdjacentHTML('beforeend','<svg class="swoosh" viewBox="0 0 300 26" preserveAspectRatio="none"><path id="sw" d="M4 18 C 80 4, 200 4, 296 14" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>');
      document.querySelectorAll('#correct .mark').forEach(m=>m.outerHTML='<svg class="check" viewBox="0 0 46 46"><path id="ck" d="M8 24 L19 35 L39 11"/></svg>');
      const w=document.querySelector('.panel .wrong:not(.option)'); if(w&&document.body.dataset.kind==='mistake') w.insertAdjacentHTML('beforeend','<i class="strike" id="strike"></i>');
      document.getElementById('countdown').style.display='none';
    }
    function burst(t,t0,el){
      const box=el.getBoundingClientRect(); const cx=box.left+box.width*.5, cy=box.top+box.height*.5; const dt=t-t0;
      document.querySelectorAll('#confetti i').forEach((n,i)=>{const c=CONF[i];
        if(dt<0||dt>1.8){n.style.opacity=0;return}
        const x=cx+Math.cos(c.a)*c.v*dt*.9, y=cy+Math.sin(c.a)*c.v*dt*.75+900*dt*dt;
        n.style.opacity=Math.max(0,1-dt/1.8); n.style.transform=`translate(${x}px,${y}px) rotate(${c.sp*dt}deg)`;});
    }
    function motion(t,total){
      document.getElementById('b1').style.transform=`translate(${Math.sin(t*.35)*70}px,${Math.cos(t*.3)*50}px)`;
      document.getElementById('b2').style.transform=`translate(${Math.cos(t*.25)*80}px,${Math.sin(t*.4)*60}px)`;
      document.getElementById('b3').style.transform=`translate(${Math.sin(t*.3+1)*60}px,${Math.cos(t*.22)*70}px)`;
      document.querySelectorAll('#dust i').forEach((n,i)=>{const d=DUST[i];const y=(d.y-d.v*t+1920)%1920;n.style.transform=`translate(${d.x+Math.sin(t*.8+d.p)*18}px,${y}px) scale(${d.r/5})`;n.style.opacity=d.o*(.6+.4*Math.sin(t*2+d.p));});
      document.querySelectorAll('.headline .ln').forEach((l,i)=>{const a=ease(clamp((t-.05-i*.16)/.55));l.style.opacity=a;l.style.transform=`translateY(${(1-a)*60}px)`;});
      const sw=document.getElementById('sw'); if(sw) sw.style.strokeDashoffset=100-100*ease(clamp((t-.55)/.5));
      const eb=document.getElementById('eyebrow'); const ea=ease(clamp(t/.4)); eb.style.opacity=ea; eb.style.transform=`translateX(${(1-ea)*-30}px)`;
      const panel=document.getElementById('panel'); const pa=back(clamp((t-.3)/.55)); panel.style.opacity=clamp((t-.3)/.3); panel.style.transform=`translateY(${(1-pa)*80}px) scale(${lerp(.94,1,pa)})`;
      document.querySelectorAll('.option').forEach((o,i)=>{const a=back(clamp((t-.65-i*.12)/.45));o.style.transform=`translateX(${(1-a)*-60}px)`;o.style.opacity=clamp((t-.65-i*.12)/.25);});
      const ck=document.getElementById('ck'); if(ck) ck.style.strokeDashoffset=60-60*ease(clamp((t-RV()-.1)/.4));
    }
    window.configure=data=>{
      document.body.dataset.kind=data.kind;
      document.getElementById('eyebrow').textContent=data.eyebrow;
      document.getElementById('headline').innerHTML=data.headline;
      const panel=document.getElementById('panel');
      if(data.kind==='mistake'){
        panel.innerHTML=`<div class="wrong" style="margin-top:0"><span class="mark">✕</span>${data.wrong}</div><div id="correct" class="correct"><span class="mark">✓</span><span id="correctText"></span></div>`;
      }else if(data.kind==='quiz'){
        panel.innerHTML=`<div class="wrong" style="margin-top:0;border-color:#A891F755;background:#ffffff0d;color:#fff">${data.prompt}</div><div class="options">${data.options.map((option,index)=>`<div class="wrong option" data-option="${index}" style="margin-top:18px;padding:24px 30px;font-size:44px">${String.fromCharCode(65+index)} <span style="color:#A891F7">·</span> ${option}</div>`).join('')}</div><div id="correct" class="correct"><span class="mark">✓</span><span id="correctText"></span></div>`;
      }else{
        panel.innerHTML=`<div class="word" style="margin-top:10px">${data.word}</div><div class="word-meta">${data.part_of_speech}</div><div class="word-hy">${data.armenian}</div><div id="example" class="example"></div><div class="example-hy">${data.example_hy}</div>`;
      }
      const text=data.kind==='word'?data.example:data.correct;
      if(data.kind!=='word'){
        const html=data.wordTimings&&data.wordTimings.length===text.split(/\s+/).length
          ? text.split(/\s+/).map((word,index)=>`<span class="correct-word" data-word="${index}">${word}</span>`).join(' ')
          : text;
        document.getElementById('correctText').innerHTML=html;
        if(data.kind==='mistake'){const bad=data.wrong.toLowerCase().split(/\s+/);document.querySelectorAll('#correctText .correct-word').forEach((el,i)=>{if((bad[i]||'')!==el.textContent.toLowerCase())el.classList.add('fix')});}
      }else{
        const html=data.wordTimings&&data.wordTimings.length===text.split(/\s+/).length
          ? text.split(/\s+/).map((word,index)=>`<span class="correct-word" data-word="${index}">${word}</span>`).join(' ')
          : text;
        document.getElementById('example').innerHTML=html;
      }
      if(data.kind==='mistake') document.getElementById('armenian').textContent=data.explanation_hy;
      if(data.kind==='quiz') document.getElementById('armenian').innerHTML=`<span id="quizExplanation">${data.explanation_hy}</span>`;
      motionSetup();
    };
    window.seek=t=>{
      const total=window.REEL_DURATION||10;
      document.getElementById('progress').style.width=(clamp(t/total)*100)+'%';
      const panel=document.getElementById('panel');
      const reveal=t>=RV();
      if(window.REEL_KIND==='mistake'){
        const answer=document.getElementById('correct');
        const amount=ease(clamp((t-RV()+.1)/.55)); answer.style.opacity=amount; answer.style.transform=`translateY(${(1-amount)*18}px)`;
      }else if(window.REEL_KIND==='quiz'){
        const countdown=document.getElementById('countdown');
        const value=t<1.4?'3':t<2.3?'2':t<3.15?'1':'';
        countdown.textContent=value; countdown.style.opacity=value?1:0;
        const ex=document.getElementById('armenian'); ex.style.opacity=ease(clamp((t-RV()-.7)/.5));
        const answer=document.getElementById('correct');
        const amount=ease(clamp((t-RV()+.1)/.55)); answer.style.opacity=amount; answer.style.transform=`translateY(${(1-amount)*18}px)`;
        document.querySelectorAll('.option').forEach((element,index)=>{
          element.style.borderColor=reveal&&index===window.CORRECT_INDEX?'#2E9E6A99':'#A891F755';
          element.style.background=reveal&&index===window.CORRECT_INDEX?'#2E9E6A1c':'#ffffff0d';
          element.classList.toggle('ok',reveal&&index===window.CORRECT_INDEX);
        });
      }
      document.querySelectorAll('.correct-word').forEach(element=>{
        const index=Number(element.dataset.word); const timing=window.WORD_TIMINGS[index];
        if(!timing) return;
        const fixed=element.classList.contains('fix');element.className='correct-word'+(fixed?' fix':'')+(t>=timing[1]?' done':t>=timing[0]?' now':'');
      });
      const outro=ease(clamp((t-(total-1.9))/.8));
      document.getElementById('outro').style.opacity=outro;
      document.getElementById('outro').style.transform=`scale(${1.03-.03*outro})`;
      motion(t,total);
      if(window.REEL_KIND==='quiz'){
        const ring=document.getElementById('ring'); const cd0=RV()-5;
        ring.style.opacity=(t<RV())?ease(clamp((t-cd0+.3)/.4))*ease(clamp((RV()-t)/.2)):0;
        document.getElementById('arc').style.strokeDashoffset=704*(1-clamp((t-cd0)/5));
        const n=document.getElementById('ringNum'); n.textContent=String(Math.min(5,Math.max(1,Math.ceil(RV()-t))));
        const ph=Math.max(0,t-cd0)%1; n.style.transform=`scale(${1+.35*Math.exp(-ph*7)})`;
        document.querySelectorAll('.option').forEach((o,i)=>{if(t>=RV()&&i!==window.CORRECT_INDEX){o.style.opacity=lerp(1,.4,ease(clamp((t-RV())/.4)))}});
        const ok=document.querySelector('.option.ok'); if(ok){burst(t,RV()+.05,ok); const g=ease(clamp((t-RV())/.3)); ok.style.boxShadow=`0 0 ${60*g}px #2E9E6A66`; ok.style.transform=`scale(${1+.04*Math.sin(clamp((t-RV())/.5)*Math.PI)})`;}
      }
      if(window.REEL_KIND==='mistake'){
        const w=document.querySelector('.panel .wrong'); const sh=t>1.8&&t<2.3?Math.sin((t-1.8)*60)*10*(1-(t-1.8)/.5):0; w.style.transform=`translateX(${sh}px)`;
        const st=document.getElementById('strike'); if(st) st.style.transform=`scaleX(${ease(clamp((t-2.4)/.5))})`;
        burst(t,RV()+.15,document.getElementById('correct'));
        document.getElementById('armenian').style.opacity=ease(clamp((t-RV()-.8)/.5));
      }
      const o2=clamp((t-(total-1.9))/.8);
      document.getElementById('rays').style.transform=`rotate(${t*12}deg)`;
      document.getElementById('outroLogo').style.transform=`scale(${back(clamp(o2*1.4))})`;
      document.getElementById('saveChip').style.transform=`scale(${back(clamp(o2*1.6-.3))})`;
    };
  </script>
</body>
</html>
