<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <link rel="icon" href="data:,">
 <style>
 @font-face{font-family:Inter;src:url("__INTER_FONT__") format("woff2");font-weight:100 900;font-display:block}
 @font-face{font-family:Playfair;src:url("__PLAYFAIR_FONT__") format("woff2");font-weight:400 900;font-display:block}
 @font-face{font-family:Playfair;src:url("__PLAYFAIR_ITALIC_FONT__") format("woff2");font-weight:400 900;font-style:italic;font-display:block}
 *{box-sizing:border-box;margin:0}
 html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:Inter,sans-serif;color:#2A2230}
 /* picture: a square 3D diorama, alive with parallax, melting into the paper on every side */
 .stage{position:absolute;left:-135px;top:285px;width:1350px;height:1350px;
   -webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 48%,#000 62%,rgba(0,0,0,.6) 80%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at 50% 48%,#000 62%,rgba(0,0,0,.6) 80%,transparent 100%)}
 .stage canvas{position:absolute;inset:0;width:1350px;height:1350px;opacity:0}
 #fx{position:absolute;left:-135px;top:285px;width:1350px;height:1350px;pointer-events:none}
 /* full-screen picture: no text under it, the speech bubbles carry the words */
 .title,.learn{display:none!important}
 .title{position:absolute;left:0;right:0;top:1360px;text-align:center;font:700 84px/1.05 Playfair,serif;color:#2A2230;opacity:0}
 .title em{font-style:italic;font-weight:600;color:var(--accent)}
 .title small{display:block;margin-top:14px;font:700 24px Inter;letter-spacing:7px;color:#2A223088;text-transform:uppercase}
 /* speech bubbles: next to the speaker, coloured per person */
 .bub{position:absolute;max-width:660px;padding:24px 34px 26px;border-radius:34px;background:#FFFDF9;box-shadow:0 18px 40px #4a2a1a26,0 2px 0 #fff inset;
   font:600 45px/1.27 Inter,sans-serif;color:#2A2230;transform-origin:var(--ox) 100%;opacity:0;z-index:5}
 .bub b{display:block;font:800 21px Inter;letter-spacing:4px;text-transform:uppercase;color:var(--c);margin-bottom:6px}
 .bub:after{content:"";position:absolute;bottom:-20px;left:var(--tail);width:40px;height:40px;background:#FFFDF9;transform:rotate(45deg);border-radius:6px;z-index:-1}
 .bub .w{display:inline-block;transition:none}
 .bub .w.on{color:var(--c)}
 .bub .k{background:linear-gradient(transparent 58%,var(--hl) 58%);border-radius:4px}
 /* phrase to learn: appears under the picture when a [phrase] is spoken */
 .learn{position:absolute;left:70px;right:70px;top:1390px;text-align:center;opacity:0}
 .learn i{display:inline-block;font:800 26px Inter;letter-spacing:7px;color:#2A223080;text-transform:uppercase}
 .learn div{margin-top:20px;font:600 italic 78px/1.12 Playfair,serif;text-wrap:balance;color:#2A2230}
 .learn div span{background:linear-gradient(transparent 62%,var(--hl) 62%)}
 /* end: the three phrases to keep */
 .recap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;opacity:0;background:var(--paper);z-index:9}
 .recap h2{font:700 82px/1.05 Playfair,serif;text-align:center}.recap h2 em{font-style:italic;color:var(--accent)}
 .recap p{font:600 46px/1.25 Inter;padding:22px 40px;border-radius:30px;background:#FFFDF9;box-shadow:0 14px 34px #4a2a1a1c;max-width:900px;text-align:center}
 .recap small{margin-top:20px;font:700 30px Inter;color:#2A2230aa}
 </style>
</head>
<body>
 <div class="stage" id="stage"></div>
 <canvas id="fx" width="1080" height="1080"></canvas>
 <div class="title" id="title"></div>
 <div id="bubbles"></div>
 <div class="learn" id="learn"><i>Learn this</i><div id="learnText"></div></div>
 <section class="recap" id="recap"><h2>Say it <em>like this</em></h2><div id="recapList" style="display:grid;gap:22px;justify-items:center"></div><small>Save it and practise out loud</small></section>
 <script>
 const clamp=x=>Math.max(0,Math.min(1,x)), ease=x=>1-Math.pow(1-x,3), io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
 const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
 let D,T,gls=[],bubs=[];
 // ---------- WebGL parallax: every pixel moves by its depth, like a slow camera in a real 3D set ----------
 const VS=`attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;uv.y=1.-uv.y;gl_Position=vec4(p,0,1);}`;
 const FS=`precision highp float;varying vec2 uv;uniform sampler2D img,dep;uniform vec2 cam;uniform float zoom;
  void main(){vec2 c=(uv-.5)/zoom+.5;float d=texture2D(dep,c).r;
   vec2 o=cam*(d-.42);                           // near things move more than far things
   for(int i=0;i<3;i++){d=texture2D(dep,c+o).r;o=cam*(d-.42);}   // a few steps: steadier edges
   gl_FragColor=texture2D(img,clamp(c+o,.002,.998));}`;
 function makeGL(cv,img,dep){const g=cv.getContext('webgl',{preserveDrawingBuffer:true,antialias:true,premultipliedAlpha:false});
  const sh=(t,s)=>{const o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);return o};
  const pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,VS));g.attachShader(pr,sh(g.FRAGMENT_SHADER,FS));g.linkProgram(pr);g.useProgram(pr);
  const b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);
  const l=g.getAttribLocation(pr,'p');g.enableVertexAttribArray(l);g.vertexAttribPointer(l,2,g.FLOAT,false,0,0);
  const tex=(im,u,n)=>{const t=g.createTexture();g.activeTexture(g.TEXTURE0+n);g.bindTexture(g.TEXTURE_2D,t);
   g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);
   g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);
   g.texImage2D(g.TEXTURE_2D,0,g.RGB,g.RGB,g.UNSIGNED_BYTE,im);g.uniform1i(g.getUniformLocation(pr,u),n)};
  tex(img,'img',0);tex(dep,'dep',1);
  return {draw:(cx,cy,z)=>{g.viewport(0,0,cv.width,cv.height);g.uniform2f(g.getUniformLocation(pr,'cam'),cx,cy);g.uniform1f(g.getUniformLocation(pr,'zoom'),z);g.drawArrays(g.TRIANGLE_STRIP,0,4)}}}
 const load=src=>new Promise((r,j)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=j;i.src=src});
 // ---------- living details: floating light, falling leaves ----------
 function rnd(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
 let motes=[],leaves=[];
 function makeFx(){const r=rnd(7);motes=[...Array(46)].map(()=>({x:r(),y:r(),s:2+r()*5,v:.006+r()*.01,ph:r()*6.3}));
  const r2=rnd(11);leaves=[...Array(14)].map(()=>({x:r2(),y:r2(),s:14+r2()*14,v:.035+r2()*.03,sw:.03+r2()*.04,ph:r2()*6.3,c:['#E8A04A','#D9772F','#F2C14E','#C9622B'][Math.floor(r2()*4)]}))}
 function drawFx(t,scene){const c=document.getElementById('fx').getContext('2d');c.clearRect(0,0,1080,1080);
  const fx=(D.scenes[scene]||{}).fx||'dust';
  for(const m of motes){const y=((m.y-t*m.v)%1+1)%1, x=m.x+Math.sin(t*.6+m.ph)*.015, a=.25+.35*Math.sin(t*1.3+m.ph)**2;
   c.fillStyle=`rgba(255,240,205,${a})`;c.beginPath();c.arc(x*1080,y*1080,m.s,0,7);c.fill()}
  if(fx==='leaves') for(const l of leaves){const y=((l.y+t*l.v)%1+1)%1, x=l.x+Math.sin(t*1.1+l.ph)*l.sw;
   c.save();c.translate(x*1080,y*1080);c.rotate(Math.sin(t*1.7+l.ph)*1.2);c.fillStyle=l.c;c.globalAlpha=.85;
   c.beginPath();c.ellipse(0,0,l.s,l.s*.55,0,0,7);c.fill();c.restore()}}
 window.configure=async(data,timeline)=>{D=data;T=timeline;
  document.documentElement.style.setProperty('--paper',D.paper);document.documentElement.style.setProperty('--accent',D.accent||'#C8603A');
  document.getElementById('title').innerHTML=`${D.title.replace(/(\S+)$/,'<em>$1</em>')}<small>${D.series}</small>`;
  const st=document.getElementById('stage');
  for(const [i,s] of D.scenes.entries()){const cv=document.createElement('canvas');cv.width=Math.round(1350*devicePixelRatio);cv.height=cv.width;st.appendChild(cv);
   gls.push({cv,gl:makeGL(cv,await load(s.pic),await load(s.depth))})}
  makeFx();
  // bubbles, one per line
  const B=document.getElementById('bubbles');
  T.lines.forEach((ln,i)=>{const p=D.people[ln.who];const el=document.createElement('div');el.className='bub';
   el.style.setProperty('--c',p.colour);el.style.setProperty('--hl',p.colour+'33');
   let k=false;el.innerHTML=`<b>${ln.who}</b>`+ln.text.split(' ').map((w,j)=>{const o=w.includes('[');const c=w.includes(']');const s=k||o;if(o)k=true;if(c)k=false;
    return `<span class="w${s?' k':''}" data-j="${j}">${w.replace(/[\[\]]/g,'')}</span>`}).join(' ');
   B.appendChild(el);
   // place: above the speaker's head, inside the picture, tail pointing at them
   const [hx,hy]=ln.head; const w=Math.min(660,el.offsetWidth), h=el.offsetHeight;
   let x=-135+hx*1350-w/2, y=285+hy*1350-h-34; x=Math.max(36,Math.min(1044-w,x)); y=Math.max(110,y);
   el.style.left=x+'px';el.style.top=y+'px';const tail=Math.max(30,Math.min(w-70,-135+hx*1350-x-20));el.style.setProperty('--tail',tail+'px');el.style.setProperty('--ox',(tail+20)+'px');
   bubs.push(el)});
  document.getElementById('recapList').innerHTML=D.recap.map(r=>`<p>${r}</p>`).join('');
 };
 window.seek=t=>{
  // pictures: cross-fade between scenes; each one drifts like a slow camera move
  T.scenes.forEach((s,i)=>{const fadeIn=i?clamp((t-s.at)/1.0):1, fadeOut=i<T.scenes.length-1?clamp((t-T.scenes[i+1].at)/1.0):0;
   const o=io(fadeIn)*(1-io(fadeOut)); const g=gls[i]; g.cv.style.opacity=o;
   if(o>0){const u=clamp((t-s.at)/Math.max(3,s.end-s.at+1)); const dir=i%2?-1:1;
    g.gl.draw(dir*(.028*u-.014)+Math.sin(t*.5)*.003, -.010+.016*u, 1.04+.06*io(u))}});
  const sc=T.scenes.reduce((a,s,i)=>t>=s.at?i:a,0); drawFx(t,sc);
  document.getElementById('fx').style.opacity=clamp(t/1.2)*(1-clamp((t-T.recapAt)/.5));
  // title at the start
  document.getElementById('title').style.opacity=clamp(t/.6)*(1-clamp((t-(T.lines[0].at-.2))/.5));
  // bubbles: pop in when the line starts, words light up as they are spoken, the old one fades when the next speaker talks
  let learn=null;
  T.lines.forEach((ln,i)=>{const el=bubs[i];const nxt=T.lines[i+1];const sameScene=nxt&&nxt.scene===ln.scene;
   const end=nxt?(sameScene?nxt.at+.25:T.scenes[ln.scene+1]?.at??ln.end+1):T.recapAt;
   const a=clamp((t-ln.at+.18)/.35), z=1-clamp((t-end)/.35);
   el.style.opacity=a*z*(sameScene?1-clamp((t-nxt.at+.3)/.12):1);
   el.style.transform=`scale(${.6+.4*back(clamp((t-ln.at+.18)/.45))})`;
   el.querySelectorAll('.w').forEach((w,j)=>w.classList.toggle('on',t>=ln.words[j][0]&&t<ln.end+.15));
   if(ln.phrase&&t>=ln.at&&t<end+0.6) learn={text:ln.phrase,at:ln.at,end:end+0.6}});
  const L=document.getElementById('learn');
  if(learn){document.getElementById('learnText').innerHTML=`<span>${learn.text}</span>`;L.style.opacity=clamp((t-learn.at-.3)/.4)*(1-clamp((t-learn.end+.4)/.4));L.style.transform=`translateY(${(1-ease(clamp((t-learn.at-.3)/.5)))*30}px)`}
  else L.style.opacity=0;
  document.getElementById('recap').style.opacity=clamp((t-T.recapAt)/.6);
 };
 </script>
</body>
</html>
