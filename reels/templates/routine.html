<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <link rel="icon" href="data:,">
 <style>
 @font-face{font-family:Inter;src:url("__INTER_FONT__") format("woff2");font-weight:100 900;font-display:block}
 @font-face{font-family:Literata;src:url("__LITERATA_FONT__") format("woff2");font-weight:100 900;font-display:block}
 @font-face{font-family:Literata;src:url("__LITERATA_ITALIC__") format("woff2");font-weight:100 900;font-style:italic;font-display:block}
 @font-face{font-family:NotoArmenian;src:url("__ARMENIAN_FONT__") format("woff2");font-weight:100 900;font-display:block}
 *{box-sizing:border-box;margin:0}
 :root{--c:#B9790B;--ink:#17183A;--muted:#5E5B74;--card:#FFFCF6}
 html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;background:#2a2433}
 /* per-scene background: the scene's own picture, blurred, so every sentence sits on its own colours */
 .bg{position:absolute;inset:-120px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.35) brightness(.92);opacity:0;will-change:opacity}
 .shade{position:absolute;inset:0;background:linear-gradient(180deg,#0000 0%,#0000 55%,#0b0a1a40 100%),radial-gradient(1200px 900px at 50% 38%,#ffffff22,#0000 70%)}
 .pill{position:absolute;top:74px;left:64px;display:flex;align-items:center;gap:16px;padding:10px 26px 10px 10px;border-radius:99px;background:#FFFCF6e6;box-shadow:0 12px 30px #0003;z-index:5}
 .pill img{width:60px;height:60px;border-radius:16px}.pill b{display:block;font:700 26px Literata,serif;color:var(--ink)}.pill span{display:block;margin-top:3px;font:800 15px Inter;letter-spacing:3.5px;color:#8C89A0}
 .chip{position:absolute;top:86px;right:64px;z-index:5;font:800 22px Inter;letter-spacing:4px;color:#fff;background:#17183Acc;padding:14px 24px;border-radius:99px}
 .frame{position:absolute;left:80px;top:250px;width:920px;height:920px;border-radius:52px;overflow:hidden;border:10px solid #FFFCF6;box-shadow:0 40px 90px #0b0a1a66;background:#FFFCF6;z-index:3}
 .shot{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
 .shot img{width:100%;height:100%;object-fit:cover;display:block}
 .count{position:absolute;right:26px;top:26px;z-index:4;font:800 24px Inter;letter-spacing:2px;color:#fff;background:#17183Ab3;padding:10px 18px;border-radius:99px}
 .card{position:absolute;left:70px;right:70px;top:1215px;min-height:330px;padding:44px 50px 40px;border-radius:44px;background:var(--card);box-shadow:0 30px 70px #0b0a1a55;z-index:4}
 .card:before{content:"";position:absolute;left:50px;top:0;width:120px;height:8px;border-radius:0 0 8px 8px;background:var(--c)}
 .say{position:relative}
 .say .en{font:600 66px/1.18 Literata,serif;color:var(--ink);letter-spacing:-.5px}
 .say .en .w{display:inline-block;opacity:.32;transition:none}
 .say .en .hl{position:relative;display:inline;color:var(--c);font-style:italic;font-weight:700}
 .say .en .hl:after{content:"";position:absolute;left:-4px;right:-4px;bottom:4px;height:16px;border-radius:6px;background:color-mix(in srgb,var(--c) 22%,transparent);transform-origin:left;transform:scaleX(var(--p,0));z-index:-1}
 .say .hy{margin-top:22px;font:500 36px/1.4 NotoArmenian,sans-serif;color:var(--muted)}
 .rep{position:absolute;left:50px;bottom:-34px;display:flex;align-items:center;gap:12px;background:var(--c);color:#fff;font:800 22px Inter;letter-spacing:3px;padding:14px 26px;border-radius:99px;box-shadow:0 12px 26px #0003;opacity:0}
 .rep em{font:600 24px NotoArmenian;font-style:normal;letter-spacing:0;opacity:.9}
 .dots{position:absolute;left:0;right:0;top:1640px;display:flex;justify-content:center;gap:14px;z-index:4}
 .dots i{display:block;width:14px;height:14px;border-radius:99px;background:#ffffff66}
 .dots i.on{width:44px;background:#fff}
 .foot{position:absolute;left:70px;right:70px;bottom:120px;display:flex;justify-content:space-between;font:700 26px Inter;color:#ffffffd9;z-index:4}
 /* intro */
 .intro{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0}
 .intro .k{margin-top:300px;font:800 26px Inter;letter-spacing:9px;color:#fff;text-shadow:0 4px 20px #0006}
 .intro .q{margin-top:26px;width:900px;font:700 92px/1.06 Literata,serif;letter-spacing:-2px;color:#fff;text-shadow:0 10px 40px #0007}
 .intro .q em{color:#FFE29A}
 .intro .qhy{margin-top:22px;font:500 40px NotoArmenian;color:#ffffffe6;text-shadow:0 4px 20px #0006}
 .intro .hero{margin-top:60px;width:560px;height:560px;border-radius:300px;overflow:hidden;border:12px solid #FFFCF6;box-shadow:0 40px 90px #0008}
 .intro .hero img{width:100%;height:100%;object-fit:cover}
 .intro .name{margin-top:-40px;position:relative;font:800 30px Inter;letter-spacing:4px;color:var(--ink);background:#FFFCF6;padding:14px 34px;border-radius:99px;box-shadow:0 14px 30px #0004}
 /* outro (shared GSAP outro in kinetic.js) */
 .outro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;opacity:0;z-index:9;background:#F4EFE4}
 .outro img{width:170px;height:170px;border-radius:42px}
 .outro h2{margin-top:44px;width:900px;font:700 78px/1.08 Literata,serif;color:var(--ink)}
 .outro h2 em{color:var(--c)}
 .outro p{margin-top:22px;font:600 38px NotoArmenian,Inter,sans-serif;color:var(--muted)}
 .save{margin-top:46px;padding:16px 34px;border-radius:99px;font:800 34px Inter;color:#fff;background:var(--c)}
 .follow{margin-top:26px;font:700 30px NotoArmenian,Inter,sans-serif;color:var(--ink)}
 .signature{margin-top:58px;font:800 24px Inter;letter-spacing:5px;color:#8C89A0}
 </style>
</head>
<body>
 <div id="bgs"></div><div class="shade"></div>
 <div class="pill"><img src="__LOGO_DATA__" alt=""><div><b>Gayane Torosyan</b><span>@ENGLISH.READINGROOM</span></div></div>
 <div class="chip" id="chip"></div>
 <div class="frame" id="frame"><div class="count" id="count"></div></div>
 <div class="card" id="card"><div class="say" id="say"><div class="en" id="en"></div><div class="hy" id="hy"></div></div><div class="rep" id="rep">YOUR TURN <em>· կրկնի՛ր</em></div></div>
 <div class="dots" id="dots"></div>
 <footer class="foot"><span>Save it · Share it</span><span>@english.readingroom</span></footer>
 <section class="intro" id="intro"><div class="k" id="introK"></div><div class="q" id="introQ"></div><div class="qhy" id="introHy"></div><div class="hero"><img id="heroImg" alt=""></div><div class="name" id="heroName"></div></section>
 <section id="outro" class="outro"><img id="outroLogo" src="__LOGO_DATA__" alt=""><h2 id="outroH"></h2><p id="outroP"></p><span class="save" id="saveChip">Save</span><span class="follow">Անհատական և խմբային դասեր · գրե՛ք Direct-ով</span><span class="signature">@ENGLISH.READINGROOM</span></section>
 <script src="__GSAP__/gsap.min.js"></script><script src="__GSAP__/SplitText.min.js"></script><script src="__GSAP__/../../../reels/templates/kinetic.js"></script>
 <script>
 const clamp=x=>Math.max(0,Math.min(1,x)), ease=x=>1-Math.pow(1-x,3), io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
 let D=null,T=null;
 const lastEm=s=>{const w=s.split(' ');return w.slice(0,-1).join(' ')+' <em>'+w.at(-1)+'</em>';};
 // "I [turn off] the alarm." -> words with the bracketed phrase marked
 function words(line){const out=[];let hl=false;line.split(/(\[|\])/).forEach(p=>{if(p==='[')hl=true;else if(p===']')hl=false;else p.split(' ').filter(Boolean).forEach(w=>out.push({w,hl}));});return out;}
 window.configure=(data,timeline)=>{D=data;T=timeline;
  document.documentElement.style.setProperty('--c',data.color);
  chip.textContent=`MY DAY · ${String(data.number).padStart(2,'0')}`;
  bgs.innerHTML=data.pics.map((p,i)=>`<div class="bg" id="bg${i}" style="background-image:url(${p})"></div>`).join('');
  frame.insertAdjacentHTML('afterbegin',data.pics.map((p,i)=>`<div class="shot" id="s${i}"><img src="${p}"></div>`).join(''));
  dots.innerHTML=data.lines.map(()=>'<i></i>').join('');
  introK.textContent=`MY DAY · ${data.title.toUpperCase()}`; introQ.innerHTML=lastEm(data.question); introHy.textContent=data.question_hy;
  heroImg.src=data.pics[0]; heroName.textContent=`Meet ${data.hero}!`;
  outroH.innerHTML=`Now tell us about <em>your day!</em>`; outroP.textContent='Գրի՛ր անգլերեն մեկնաբանություններում';
 };
 let shown=-1;
 function setScene(i){ if(i===shown) return; shown=i;
  const ws=words(D.lines[i]); let k=0;
  en.innerHTML=ws.map((x,j)=>{const span=`<span class="w" data-j="${j}">${x.w}</span>`;return span;}).join(' ');
  // wrap highlighted runs
  const spans=[...en.querySelectorAll('.w')]; let run=null;
  spans.forEach((s,j)=>{ if(ws[j].hl){ if(!run){run=document.createElement('span');run.className='hl';s.before(run);} run.append(s); if(j+1<spans.length&&ws[j+1].hl) run.append(' '); } else run=null; });
  hy.textContent=D.lines_hy[i]; count.textContent=`${i+1} / ${D.lines.length}`;
  dots.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===i));
 }
 window.fit=()=>{ if(window.K){K.init();K.title(introQ,.25);} };
 window.seek=t=>{
  const S=T.scenes, n=S.length;
  // intro
  const ia=ease(clamp(t/.5)), io2=clamp((t-(S[0].at-.55))/.45); intro.style.opacity=ia*(1-io2);
  heroImg.parentNode.style.transform=`scale(${.6+.4*ease(clamp((t-.35)/.6))})`;
  const cur=t<S[0].at?0:S.reduce((a,s,i)=>t>=s.at?i:a,0);
  // backgrounds and pictures
  S.forEach((s,i)=>{const a=clamp((t-s.at)/.6), nx=i+1<n?clamp((t-S[i+1].at)/.6):0;
   const bg=document.getElementById('bg'+i); bg.style.opacity=(i===0&&t<S[0].at)?1:(a*(1-nx));
   const sh=document.getElementById('s'+i); const vis=(i===0&&t<S[0].at)?1:io(a)*(1-0); sh.style.opacity=i<cur?0:(i===cur?vis:0);
   const local=Math.max(0,t-s.at), dir=i%2?1:-1;
   sh.style.transform=`translateX(${(1-io(a))*dir*120}px) scale(${1.10-0.06*io(a)+0.035*clamp(local/(s.end-s.at))})`;});
  setScene(cur);
  const s=S[cur];
  // card in/out
  const cin=ease(clamp((t-s.at)/.45)), cout=cur+1<n?clamp((t-(S[cur+1].at-.25))/.25):0;
  say.style.opacity=cin*(1-cout); say.style.transform=`translateY(${(1-cin)*30-cout*20}px)`;
  card.style.transform=`translateY(${(1-ease(clamp((t-(S[0].at-.4))/.6)))*500}px)`;
  // karaoke + highlight sweep
  const W=T.words[cur]; let hlStart=null,hlEnd=null;
  en.querySelectorAll('.w').forEach(w=>{const j=+w.dataset.j, tw=W[j]; if(!tw) return; const on=t>=tw[0]-.05;
   w.style.opacity=on?1:.32; const pop=t>=tw[0]&&t<tw[0]+.25?Math.sin(Math.PI*(t-tw[0])/.25):0; w.style.transform=`translateY(${-6*pop}px)`;
   if(w.closest('.hl')){hlStart=hlStart??tw[0]; hlEnd=tw[1];}});
  const hl=en.querySelector('.hl'); if(hl&&hlStart!=null) hl.style.setProperty('--p',ease(clamp((t-hlStart)/Math.max(.3,hlEnd-hlStart))));
  // "your turn" during the pause after the voice
  const rp=t>=s.v1+.15&&t<s.end-.1; const ra=rp?ease(clamp((t-s.v1-.15)/.3)):0; rep.style.opacity=ra; rep.style.transform=`scale(${.8+.2*ra})`;
  frame.style.opacity=t<S[0].at-.5?0:ease(clamp((t-(S[0].at-.5))/.5));
  frame.style.transform=`translateY(${(1-ease(clamp((t-(S[0].at-.5))/.6)))*60}px)`;
  // outro
  const o=ease(clamp((t-(T.total-2.6))/.6)); outro.style.opacity=o;
  if(window.K&&K.ok){K.seek(t);K.outro(t-(T.total-2.6));}
 };
 </script>
</body>
</html>
