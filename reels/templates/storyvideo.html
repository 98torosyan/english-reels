<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <link rel="icon" href="data:,">
 <style>
 @font-face{font-family:Inter;src:url("__INTER_FONT__") format("woff2");font-weight:100 900;font-display:block}
 @font-face{font-family:IPA;src:url("__INTER_FONT__") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0000-00FF}
 @font-face{font-family:IPA;src:url("__INTER_EXT_FONT__") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0100-02FF}
 @font-face{font-family:IPA;src:url("__INTER_GREEK_FONT__") format("woff2");font-weight:100 900;font-display:block;unicode-range:U+0370-03FF}
 @font-face{font-family:Literata;src:url("__LITERATA_FONT__") format("woff2");font-weight:100 900;font-display:block}
 @font-face{font-family:NotoArmenian;src:url("__ARMENIAN_FONT__") format("woff2");font-weight:100 900;font-display:block}
 *{box-sizing:border-box;margin:0}
 html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif}
 .stage{position:absolute;left:0;top:0;width:1080px;height:1180px;overflow:hidden;background:#17183A;z-index:1}
 .stage #stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;will-change:transform,opacity}
 .stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(transparent,var(--paper));z-index:8}
 .stage:before{content:"";position:absolute;left:0;right:0;top:0;height:260px;background:linear-gradient(#17183A66,transparent);z-index:7}
 .vig{position:absolute;inset:0;z-index:6;background:radial-gradient(ellipse at 50% 45%,transparent 55%,#0b0a1a55 100%)}
 .grain{position:absolute;inset:-40px;z-index:6;opacity:.09;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
 .leak{position:absolute;inset:0;z-index:6;opacity:0;background:radial-gradient(circle at var(--lx,80%) 30%,#FFD58Acc,#FFB34700 55%);mix-blend-mode:screen}
 .intro{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#0b0a1a10,#0b0a1a88);opacity:0}
 .intro small{font:800 26px Inter;letter-spacing:10px;color:#FFE7B0}
 .intro .it{margin-top:18px;font:700 124px/1 Literata,serif;letter-spacing:-3px;color:#fff;text-shadow:0 8px 30px #0008}
 .intro .it em{font-style:italic;color:#FFD58A}
 .intro i{display:block;margin-top:26px;width:0;height:3px;background:#FFD58A}
 .intro .ia{margin-top:22px;font:italic 500 36px Literata,serif;color:#FFE7B0;text-shadow:0 4px 18px #0009;opacity:0}
 .outro.classic h2{width:920px;font:italic 600 84px/1.12 Literata,serif;color:var(--ink,#17183A)}
 .outro.classic h2:before{content:"“";display:block;font:700 160px/0.6 Literata,serif;color:var(--c);margin-bottom:10px}
 .outro.classic p{max-width:880px;font:600 40px/1.4 NotoArmenian,Inter,sans-serif;color:#5E5B74}
 .outro.classic .by{margin-top:18px;font:800 22px Inter;letter-spacing:5px;color:var(--c)}
 .pill{position:absolute;top:96px;left:56px;display:flex;align-items:center;gap:14px;padding:10px 22px 10px 10px;border-radius:99px;background:#FFFCF6ee;box-shadow:0 10px 30px #17183A26;z-index:3}
 .pill img{width:56px;height:56px;border-radius:16px}
 .pill b{font:700 24px Literata,serif;color:var(--ink)}.pill span{display:block;font:800 15px Inter;letter-spacing:3px;color:var(--soft)}
 .sdots{position:absolute;top:110px;right:56px;display:flex;gap:10px;z-index:3}
 .sdots i{width:14px;height:14px;border-radius:50%;background:#FFFCF680;box-shadow:0 2px 8px #0003}
 .sdots i.on{background:#fff;transform:scale(1.3)}.sdots i.done{background:#FFFCF6cc}
 .eyebrow{position:absolute;top:1150px;left:82px;right:82px;display:flex;align-items:center;justify-content:space-between;font:800 26px Inter;letter-spacing:5px;z-index:3}
 .eyebrow span{font:700 24px Inter;letter-spacing:3px;padding:6px 20px;border-radius:99px}
 .title{position:absolute;top:1215px;left:82px;right:82px;font:700 64px/1.05 Literata,serif;letter-spacing:-1.5px;color:var(--ink)}
 .title em{color:var(--c);font-style:italic}
 .wm{position:absolute;left:50%;top:1260px;width:420px;margin-left:-210px;opacity:.05;text-align:center}
 .wm img{width:420px;height:420px;filter:grayscale(1)}
 .cap{position:absolute;top:1330px;left:70px;right:70px;height:330px}
 .cap p{position:absolute;left:0;right:0;top:0;font:500 46px/1.42 Literata,serif;color:var(--ink);opacity:0}
 .cap p span{display:inline-block;padding:0 4px;margin:0 -1px;border-radius:9px}
 .progress{position:absolute;left:82px;right:82px;bottom:140px;height:7px;border-radius:99px;overflow:hidden}
 .progress i{display:block;height:100%;width:0}
 .outro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;opacity:0;z-index:9}
 .outro img{width:170px;height:170px;border-radius:42px}
 .outro h2{margin-top:44px;font:700 82px/1.06 Literata,serif}
 .outro p{margin-top:22px;font:600 38px NotoArmenian,Inter,sans-serif}
 .save{margin-top:46px;padding:16px 34px;border-radius:99px;font-size:34px;font-weight:800}
 .follow{margin-top:26px;font:700 30px NotoArmenian,Inter,sans-serif}
 .signature{margin-top:58px;font-size:24px;font-weight:800;letter-spacing:5px}
 body:before{display:none!important}   /* clean: no coloured bar on the left edge */
 .wm,.outro .signature{display:none!important}   /* clean: no watermark, no signature line */
 /* clean reels: no progress bars, scene dots, counters or small label lines */
 .progress,.sdots,.eyebrow,.dots,.count{display:none!important}
 /* classics: the picture flows on under the text, blurred and softened, instead of a hard edge */
 body.flow .stage{-webkit-mask-image:linear-gradient(#000 0,#000 58%,transparent 100%);mask-image:linear-gradient(#000 0,#000 58%,transparent 100%);background:transparent}
 body.flow .stage:after{display:none}
 #bgflow{position:absolute;inset:0;z-index:0;overflow:hidden;display:none}body.flow #bgflow{display:block}
 #bgflow .in{position:absolute;inset:-80px;filter:blur(34px) saturate(1.1)}
 #bgflow img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
 #bgflow .tint{position:absolute;inset:0;background:linear-gradient(transparent 0,#F4EFE499 45%,#F4EFE4c8 62%,#F4EFE4d8 100%)}
 body.flow .title{text-align:center;top:1205px;font-size:72px;white-space:nowrap}
 body.flow .title:before{content:attr(data-au);position:absolute;left:0;right:0;top:-46px;font:800 22px Inter;letter-spacing:7px;color:var(--c);font-style:normal}
 body.flow .title:after{content:"";display:block;width:90px;height:3px;background:var(--c);margin:22px auto 0}
 body.flow .cap{top:1350px}body.flow .cap p{text-align:center}
 </style>
</head>
<body>
 <div id="bgflow"><div class="in" id="bgIn"></div><div class="tint"></div></div>
 <div class="stage" id="stageWrap"><div id="stage"></div><div class="vig"></div><div class="grain" id="grain"></div><div class="leak" id="leak"></div><div class="intro" id="intro"><small id="introK">STORY TIME</small><div class="it" id="introT"></div><i id="introLine"></i><div class="ia" id="introA"></div></div></div>
 <div class="pill"><img src="__LOGO_DATA__" alt=""><div><b>Gayane Torosyan</b><span>@ENGLISH.READINGROOM</span></div></div>
 <div class="sdots" id="sdots"></div>
 <div class="eyebrow" id="eyebrow"><b id="series"></b><span id="level" class="chip"></span></div>
 <div class="title" id="title"></div>
 <div class="wm"><img src="__MARK_DATA__" alt=""></div>
 <div class="cap" id="cap"></div>
 <div class="progress"><i id="progress"></i></div>
 <section id="outro" class="outro"><img id="outroLogo" src="__LOGO_DATA__" alt=""><h2>Read it <em>again</em></h2><p>Կարդա՛ բարձրաձայն և պահի՛ր</p><span class="save" id="saveChip">Save</span><span class="follow">Անհատական և խմբային դասեր · գրե՛ք Direct-ով</span><span class="signature">@ENGLISH.READINGROOM</span></section>
 <script src="__GSAP__/gsap.min.js"></script><script src="__GSAP__/SplitText.min.js"></script><script src="__GSAP__/../../../reels/templates/kinetic.js"></script>
 <script>
 const clamp=x=>Math.max(0,Math.min(1,x)), ease=x=>1-Math.pow(1-x,3), io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
 const back=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
 // camera moves per scene: [scaleFrom, scaleTo, xFrom, xTo, yFrom, yTo] in % of size
 const MOVES=[[1.06,1.16,0,-2,0,-1],[1.16,1.06,-2,2,-1,0],[1.08,1.2,1,-1,1,-2],[1.15,1.05,2,-2,0,1],[1.06,1.17,-1,1,0,-2],[1.16,1.07,1,0,-2,1]];
 let D=null,T=null,W=[];
 window.configure=(data,timeline)=>{D=data;T=timeline;
  if(data.color) document.documentElement.style.setProperty('--c',data.color);
  stage.innerHTML=data.imgs.map((s,i)=>`<img id="im${i}" src="${s}">`).join('');
  document.body.classList.toggle('flow',!!data.classic); bgIn.innerHTML=data.imgs.map((s,i)=>`<img id="bg${i}" src="${s}">`).join('');
  sdots.innerHTML=data.imgs.map(()=>'<i></i>').join('');
  series.textContent=data.classic?`CLASSICS · ${data.classic.author.toUpperCase()}`:`${data.series||'STORY TIME'} · ${String(data.number).padStart(2,'0')}`; level.textContent=data.level;
  if(data.classic){ introK.textContent='CLASSICS MADE EASY'; introA.textContent=`${data.classic.author} · ${data.classic.year}`;
   outro.classList.add('classic'); const h2=outro.querySelector('h2'); h2.textContent=data.classic.quote;
   outro.querySelector('p').textContent=`«${data.classic.quote_hy}»`; h2.insertAdjacentHTML('afterend',`<div class="by">— ${data.classic.author.toUpperCase()} · ${data.classic.book.toUpperCase()}</div>`); }
  const tw=data.title.split(' '); title.innerHTML=tw.slice(0,-1).join(' ')+' <em>'+tw.at(-1)+'</em>'; introT.innerHTML=title.innerHTML; if(data.classic) title.dataset.au=data.classic.author.toUpperCase();
  let k=0; const curly=w=>w.replace(/^'/,'‘').replace(/'/g,'’');   // typographic quotes and apostrophes
  cap.innerHTML=data.scenes.map((sc,i)=>`<p id="p${i}">${sc.split(' ').map(w=>`<span data-k="${k++}">${curly(w)}</span>`).join(' ')}</p>`).join('');
 };
 window.fit=()=>{if(document.body.classList.contains('flow')){let f=72;while(title.scrollWidth>title.clientWidth&&f>46){f-=2;title.style.fontSize=f+'px';}}if(window.K){K.init();K.title(introT,.15);}document.querySelectorAll('.cap p').forEach(p=>{let f=46;while(p.scrollHeight>330&&f>34){f-=1;p.style.fontSize=f+'px';}})};
 window.seek=t=>{
  progress.style.width=(clamp(t/T.total)*100)+'%';
  const n=D.imgs.length; const st=T.sceneStart; // image i is shown from st[i]-0.35 to st[i+1]-0.35
  for(let i=0;i<n;i++){const im=document.getElementById('im'+i);
   const a=i==0?-1:st[i]-.45, b=i<n-1?st[i+1]-.45:T.total;
   const fin=i==0?1:io(clamp((t-a)/.7)); const vis=t>=a&&t<b+.7;
   im.style.opacity=vis?fin:0; im.style.zIndex=i;
   const m=MOVES[i%MOVES.length]; const p=clamp((t-Math.max(0,a))/(b+.7-Math.max(0,a)));
   const sc=m[0]+(m[1]-m[0])*p, x=m[2]+(m[3]-m[2])*p, y=m[4]+(m[5]-m[4])*p;
   const slide=i%2==1?(1-fin)*14:0;
   im.style.transform=`translate(${x+slide}%,${y}%) scale(${sc+(i%2==0&&i>0?(1-fin)*.08:0)})`;
   const bi=document.getElementById('bg'+i); bi.style.opacity=im.style.opacity; bi.style.zIndex=i; bi.style.transform=im.style.transform;
   sdots.children[i].className=t>=b?'done':(t>=a?'on':'');}
  const ia=ease(clamp((t-.15)/.6)), io2=clamp((t-1.75)/.45); intro.style.opacity=ia*(1-io2);
  introT.style.transform=`translateY(${(1-ia)*40}px) scale(${1+.04*clamp(t/2.2)})`; introK.style.opacity=ease(clamp((t-.05)/.5)); introLine.style.width=(ease(clamp((t-.5)/.8))*260)+'px'; introA.style.opacity=ease(clamp((t-.7)/.6));
  grain.style.transform=`translate(${(Math.floor(t*12)*37)%40-20}px,${(Math.floor(t*12)*53)%40-20}px)`;
  let lk=0; for(let i=1;i<n;i++){const d=t-(st[i]-.45); if(d>-.2&&d<.9) lk=Math.max(lk,Math.sin(Math.PI*clamp((d+.2)/1.1))*.55);}
  leak.style.opacity=lk; leak.style.setProperty('--lx',(60+20*Math.sin(t))+'%');
  const e=ease(clamp((t-.2)/.6)); eyebrow.style.opacity=e; title.style.opacity=e; title.style.transform=`translateY(${(1-e)*30}px)`;
  D.scenes.forEach((sc,i)=>{const p=document.getElementById('p'+i); const a=i==0?1.9:st[i]-.03, b=i<n-1?st[i+1]-.3:T.total;   // the next sentence appears only after the previous one has gone
   const o=t<a?0:t<b?ease(clamp((t-a)/.4)):1-clamp((t-b)/.25); p.style.opacity=o; p.style.transform=`translateY(${(1-ease(clamp((t-a)/.4)))*24}px)`;});
  document.querySelectorAll('.cap span').forEach(s=>{const w=T.words[+s.dataset.k]; const now=t>=w[0]&&t<w[1]; const done=t>=w[1];
   const pop=now?Math.sin(Math.PI*Math.min(1,(t-w[0])/.25)):0;
   s.style.background=now?'var(--c)':'transparent'; s.style.color=now?'#fff':''; s.style.opacity=now||done?1:.45;
   s.style.transform=pop?`translateY(${-3*pop}px) scale(${1+.06*pop})`:'';});
  const OL=T.outro||2.4; const o=ease(clamp((t-(T.total-OL))/.8)); outro.style.opacity=o; outro.style.background=`rgba(244,239,228,${o})`;
  if(window.K&&K.ok){K.seek(t);K.outro(t-(T.total-OL));} else {const o2=clamp((t-(T.total-OL))/.8); outroLogo.style.transform=`scale(${back(clamp(o2*1.4))})`; saveChip.style.transform=`scale(${back(clamp(o2*1.6-.3))})`;}
 };
 </script>
</body>
</html>
