<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <link rel="icon" href="data:,">
 <style>
 @font-face{font-family:Inter;src:url("__INTER_FONT__") format("woff2");font-weight:100 900;font-display:block}
 @font-face{font-family:Literata;src:url("__LITERATA_FONT__") format("woff2");font-weight:100 900;font-display:block}
 @font-face{font-family:NotoArmenian;src:url("__ARMENIAN_FONT__") format("woff2");font-weight:100 900;font-display:block}
 *{box-sizing:border-box;margin:0}
 html,body{width:1080px;height:1920px;overflow:hidden;background:#17183A;color:#fff;font-family:Inter,sans-serif}
 body{position:relative;background:radial-gradient(800px 650px at 90% 5%,#6A49E2aa,transparent 68%),radial-gradient(750px 800px at -10% 65%,#5A3B8C88,transparent 70%),linear-gradient(165deg,#17183A 5%,#2A1E4D 58%,#17183A)}
 .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
 .b1{width:760px;height:760px;background:#6A49E2;left:520px;top:-180px}
 .b2{width:620px;height:620px;background:#5A3B8C;left:-260px;top:980px;opacity:.45}
 .header{position:absolute;top:105px;left:82px;right:82px;display:flex;align-items:center;gap:24px}
 .logo{width:96px;height:96px;border-radius:27px;box-shadow:0 14px 36px #08061588}
 .brand-name{font-family:Literata,serif;font-size:38px;font-weight:700;letter-spacing:-.7px}
 .brand-sub{margin-top:7px;color:#A891F7;font-size:22px;font-weight:800;letter-spacing:5px}
 .rainbow{position:absolute;top:245px;left:84px;display:flex;gap:8px}
 .rainbow i{display:block;width:42px;height:8px;border-radius:8px}
 .eyebrow{position:absolute;top:296px;left:84px;right:84px;display:flex;align-items:center;justify-content:space-between}
 .eyebrow b{color:#A891F7;font-size:30px;letter-spacing:5px;font-weight:800}
 .eyebrow span{font:800 26px Inter,sans-serif;letter-spacing:3px;color:#17183A;background:#E9C46A;padding:8px 20px;border-radius:99px}
 .headline{position:absolute;top:372px;left:82px;right:82px;font:700 84px/1.1 Literata,serif;letter-spacing:-1.3px;white-space:nowrap}
 .gold{color:#E9C46A;font-style:italic;position:relative;display:inline-block}
 .swoosh{position:absolute;left:0;bottom:-16px;width:100%;height:24px;overflow:visible}
 .swoosh path{fill:none;stroke:#E9C46A;stroke-width:7;stroke-linecap:round}
 .sub{position:absolute;top:492px;left:84px;font:500 36px NotoArmenian,sans-serif;color:#C9C2E3}
 .roles{position:absolute;top:574px;left:62px;right:62px;display:flex;justify-content:space-between;align-items:center}
 .phase{font:800 26px Inter,sans-serif;letter-spacing:5px;color:#A891F7}
 .phase em{font:600 28px NotoArmenian,sans-serif;font-style:normal;letter-spacing:0;color:#E9C46A;margin-left:12px}
 .who{display:flex;gap:12px}
 .who i{font:800 22px Inter,sans-serif;font-style:normal;letter-spacing:2px;padding:8px 16px;border-radius:99px;background:#ffffff12;color:#C9C2E3}
 .who i.b{background:#E9C46A22;color:#E9C46A}
 .chat{position:absolute;top:650px;left:62px;right:62px;height:920px;overflow:hidden;mask-image:linear-gradient(180deg,transparent 0,#000 60px,#000 100%)}
 .set{position:absolute;left:0;right:0;top:0}
 .bubble{position:absolute;max-width:900px;padding:28px 36px 30px;border-radius:36px;box-shadow:0 20px 50px #07061566;opacity:0}
 .bubble.A{left:0;background:linear-gradient(155deg,#6A49E244,#ffffff0c 70%);border:1.5px solid #A891F766;border-bottom-left-radius:10px}
 .bubble.B{right:0;background:linear-gradient(155deg,#E9C46A26,#ffffff08 70%);border:1.5px solid #E9C46A77;border-bottom-right-radius:10px}
 .bubble .r{font:800 23px Inter,sans-serif;letter-spacing:3px;color:#A891F7;text-transform:uppercase}
 .bubble.B .r{color:#E9C46A;text-align:right}
 .bubble .en{margin-top:10px;font:600 56px/1.26 Literata,serif}
 .bubble .hy{margin-top:12px;font:500 36px/1.4 NotoArmenian,sans-serif;color:#E4DEFA}
 .bubble.B .en,.bubble.B .hy{text-align:right}
 .w{opacity:.5;padding:0 3px;border-radius:8px;display:inline-block}
 .w.done{opacity:1}
 .w.now{opacity:1;background:#E9C46A;color:#17183A}
 .bar{margin-top:18px;height:10px;border-radius:99px;background:#ffffff1a;overflow:hidden;display:none}
 .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#A891F7,#E9C46A)}
 .bubble.mine .bar{display:block}
 .bubble.mine .en .w{opacity:1}
 .inter{position:absolute;top:650px;left:62px;right:62px;height:1000px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0}
 .inter h2{font:700 96px/1.1 Literata,serif}
 .inter h2 .gold{font-style:italic}
 .inter p{margin-top:30px;font:500 40px/1.45 NotoArmenian,sans-serif;color:#E4DEFA}
 .inter .hint{margin-top:34px;font:800 26px Inter,sans-serif;letter-spacing:5px;color:#A891F7}
 .foot{position:absolute;left:82px;right:82px;bottom:190px;display:flex;justify-content:space-between;color:#C9C2E3;font-size:26px;font-weight:700}
 .foot .handle{letter-spacing:3px;color:#A891F7;font-weight:800}
 .progress{position:absolute;left:82px;right:82px;bottom:140px;height:7px;border-radius:99px;background:#ffffff24;overflow:hidden}
 .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6A49E2,#A891F7,#E9C46A)}
 .outro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(680px 640px at 50% 42%,#6A49E2,#2A1E4D 56%,#17183A 82%);opacity:0}
 .outro img{width:170px;height:170px;border-radius:42px;box-shadow:0 20px 60px #0009}
 .outro h2{margin-top:44px;font:700 82px/1.06 Literata,serif}
 .outro h2 em{color:#E9C46A}
 .outro p{margin-top:22px;color:#E4DEFA;font-size:40px;font-weight:600}
 .save{margin-top:46px;padding:16px 34px;border-radius:99px;background:#E9C46A;color:#17183A;font-size:36px;font-weight:800}
.follow{margin-top:22px;font-family:NotoArmenian,Inter,sans-serif;font-size:30px;font-weight:700;opacity:.9}
 .signature{margin-top:58px;color:#A891F7;font-size:24px;font-weight:800;letter-spacing:5px}
 .outro .rays{position:absolute;left:50%;top:42%;width:1400px;height:1400px;margin:-700px 0 0 -700px;background:repeating-conic-gradient(#ffffff0c 0 6deg,transparent 6deg 18deg);border-radius:50%;mask-image:radial-gradient(circle,#000 20%,transparent 62%)}
 .outro>*{position:relative}
 /* clean reels: no progress bars, scene dots, counters or small label lines */
 .progress,.sdots,.eyebrow,.dots,.count{display:none!important}
 </style>
</head>
<body>
 <div class="blob b1" id="b1"></div><div class="blob b2" id="b2"></div>
 <header class="header"><img class="logo" src="__LOGO_DATA__" alt=""><div><div class="brand-name">Gayane Torosyan</div><div class="brand-sub">ENGLISH READING ROOM</div></div></header>
 <div class="rainbow"><i style="background:#B23F78"></i><i style="background:#7A4FD6"></i><i style="background:#3E5FD9"></i><i style="background:#1C8AA3"></i><i style="background:#2E9E6A"></i><i style="background:#E8A317"></i></div>
 <div class="eyebrow" id="eyebrow"><b id="series"></b><span id="level"></span></div>
 <h1 class="headline" id="headline"></h1>
 <div class="sub" id="sub"></div>
 <div class="roles" id="roles"><div class="phase" id="phase"></div><div class="who" id="who"></div></div>
 <div class="chat"><div class="set" id="set1"></div><div class="set" id="set2"></div></div>
 <div class="inter" id="inter"><h2>Now you are <span class="gold">B</span></h2><p>Լսի՛ր A-ին և ասա՛ B-ի տողերը<br>բարձրաձայն</p><div class="hint">SPEAK WHEN THE BAR MOVES</div></div>
 <footer class="foot"><span>Let's read together</span><span class="handle">@english.readingroom</span></footer>
 <div class="progress"><i id="progress"></i></div>
 <section id="outro" class="outro"><div class="rays" id="rays"></div><img id="outroLogo" src="__LOGO_DATA__" alt=""><h2>Speak · Every · <em>Day</em></h2><p>Real English for real life.</p><span class="save" id="saveChip">Save</span><span class="follow">Անհատական և խմբային դասեր · գրե՛ք Direct-ով</span><span class="signature">GAYANE TOROSYAN · ENGLISH READING ROOM</span></section>
 <script>
 const clamp=x=>Math.max(0,Math.min(1,x)), ease=x=>1-Math.pow(1-x,3), lerp=(a,b,x)=>a+(b-a)*x;
 const back=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
 const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
 let D,T,LAYOUT={};
 window.configure=(data,timeline)=>{
  D=data;T=timeline;
  document.getElementById('series').textContent=`EVERYDAY ENGLISH · ${String(D.number).padStart(2,'0')}`;
  document.getElementById('level').textContent=D.level;
  document.getElementById('headline').innerHTML=`${esc(D.title[0])} <span class="gold">${esc(D.title[1])}<svg class="swoosh" viewBox="0 0 300 24" preserveAspectRatio="none"><path id="sw" d="M4 16 C 80 4, 200 4, 296 12" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg></span>`;
  document.getElementById('sub').textContent=D.title_hy;
  document.getElementById('who').innerHTML=`<i>A · ${esc(D.speakers.A.role)}</i><i class="b">B · ${esc(D.speakers.B.role)}</i>`;
  for(const set of [1,2]){
   const host=document.getElementById('set'+set);
   host.innerHTML=T.bubbles.map((b,i)=>b.set!==set?'':`<div class="bubble ${b.s}${b.pause?' mine':''}" id="bb${i}"><div class="r">${b.s} · ${esc(D.speakers[b.s].role)}</div><div class="en">${b.en.split(/\s+/).map((w,k)=>`<span class="w" data-k="${k}">${esc(w)}</span>`).join(' ')}</div><div class="hy">${esc(b.hy)}</div><div class="bar"><i></i></div></div>`).join('');
   let y=0; const targets=[];
   T.bubbles.forEach((b,i)=>{if(b.set!==set) return; const el=document.getElementById('bb'+i); el.style.top=y+'px'; y+=el.offsetHeight+24; targets.push({at:b.appear,off:Math.max(0,y-24-920)});});
   LAYOUT[set]=targets;
  }
 };
 function scroll(set,t){const tg=LAYOUT[set];let off=0,prev=0;for(const k of tg){if(t<k.at)break;off=lerp(prev,k.off,ease(clamp((t-k.at)/.5)));prev=k.off}return off}
 window.seek=t=>{
  const total=T.total;
  document.getElementById('progress').style.width=(clamp(t/total)*100)+'%';
  document.getElementById('b1').style.transform=`translate(${Math.sin(t*.35)*70}px,${Math.cos(t*.3)*50}px)`;
  document.getElementById('b2').style.transform=`translate(${Math.cos(t*.25)*80}px,${Math.sin(t*.4)*60}px)`;
  const eb=ease(clamp(t/.4)); const e=document.getElementById('eyebrow'); e.style.opacity=eb; e.style.transform=`translateX(${(1-eb)*-30}px)`;
  const h=ease(clamp((t-.1)/.55)); const hl=document.getElementById('headline'); hl.style.opacity=h; hl.style.transform=`translateY(${(1-h)*60}px)`;
  document.getElementById('sw').style.strokeDashoffset=100-100*ease(clamp((t-.6)/.5));
  const s=ease(clamp((t-.5)/.5)); const sub=document.getElementById('sub'); sub.style.opacity=s; sub.style.transform=`translateY(${(1-s)*20}px)`;
  const r=ease(clamp((t-.8)/.5)); document.getElementById('roles').style.opacity=r;
  const p2=t>=T.p2-.3;
  document.getElementById('phase').innerHTML=p2?'YOUR TURN<em>Քո հերթն է</em>':'LISTEN<em>Լսի՛ր</em>';
  const s1=1-ease(clamp((t-T.p1End)/.4)), s2=ease(clamp((t-T.p2+.2)/.4)), it=Math.min(ease(clamp((t-T.p1End-.2)/.4)),1-ease(clamp((t-T.p2+.5)/.4)));
  document.getElementById('set1').style.opacity=s1; document.getElementById('set2').style.opacity=s2;
  const inter=document.getElementById('inter'); inter.style.opacity=it; inter.style.transform=`scale(${lerp(.94,1,ease(clamp((t-T.p1End-.2)/.5)))})`;
  document.getElementById('set1').style.transform=`translateY(${-scroll(1,t)}px)`;
  document.getElementById('set2').style.transform=`translateY(${-scroll(2,t)}px)`;
  T.bubbles.forEach((b,i)=>{
   const el=document.getElementById('bb'+i); const a=clamp((t-b.appear)/.45);
   el.style.opacity=ease(clamp(a*1.6)); el.style.transform=`translateY(${(1-ease(a))*34}px) scale(${lerp(.96,1,back(a))})`;
   if(b.words) el.querySelectorAll('.w').forEach(w=>{const tm=b.words[+w.dataset.k]; const now=t>=tm[0]&&t<tm[1]; w.className='w'+(t>=tm[1]?' done':now?' now':'');
    const pop=now?Math.sin(Math.PI*Math.min(1,(t-tm[0])/.22)):0; w.style.transform=pop?`translateY(${-4*pop}px) scale(${1+.1*pop})`:'';});
   if(b.pause){const f=clamp((t-b.pause[0])/(b.pause[1]-b.pause[0])); el.querySelector('.bar i').style.width=(f*100)+'%';
    const on=t>=b.pause[0]&&t<=b.pause[1]; el.style.boxShadow=on?`0 0 ${40+20*Math.sin(t*5)}px #E9C46A55, 0 20px 50px #07061566`:'0 20px 50px #07061566'; el.style.borderColor=on?'#E9C46A':'#E9C46A77';}
  });
  const o=ease(clamp((t-(total-2.1))/.8)); const out=document.getElementById('outro'); out.style.opacity=o; out.style.transform=`scale(${1.03-.03*o})`;
  document.getElementById('rays').style.transform=`rotate(${t*12}deg)`;
  const o2=clamp((t-(total-2.1))/.8);
  document.getElementById('outroLogo').style.transform=`scale(${back(clamp(o2*1.4))})`;
  document.getElementById('saveChip').style.transform=`scale(${back(clamp(o2*1.6-.3))})`;
 };
 </script>
</body>
</html>
