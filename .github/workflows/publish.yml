name: Publish due post

on:
  schedule:
    - cron: "7 9 * * *"   # 13:07 Yerevan — carousels
    - cron: "7 15 * * *"  # 19:07 Yerevan — reels
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (send nothing to Instagram)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish (real only when PUBLISH_ENABLED is true)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ (vars.PUBLISH_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false)) && '0' || '1' }}
        run: python publish/run_due.py
      - name: Save published status
        run: |
          if ! git diff --quiet queue.json; then
            git config user.name 98torosyan
            git config user.email 98torosyan@gmail.com
            git commit -m "Նշել հրապարակված նյութը" queue.json
            git push
          fi
