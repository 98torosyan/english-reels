name: Publish due post

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07; publishes the item that is due
  push:
    branches: [main]
    paths: ["publish/TRIGGER"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (send nothing to Instagram)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the latest queue (never publish twice)
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish (real only when publish/ENABLED exists)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MANUAL_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          if [ -f publish/ENABLED ] && [ "$MANUAL_DRY" = "0" ]; then export DRY_RUN=0; else export DRY_RUN=1; fi
          echo "DRY_RUN=$DRY_RUN"
          python publish/run_due.py
      - name: Save published status
        run: |
          if ! git diff --quiet queue.json; then
            git config user.name 98torosyan
            git config user.email 98torosyan@gmail.com
            git commit -m "Նշել հրապարակված նյութը" queue.json
            git push
          fi
