name: Make a story reel
# One moving painted story, start to finish, with no computer: English check -> narration -> six clips made smooth
# (48 fps) and sharp (4K width) in parallel -> the reel rendered -> kept on the motion-clips branch -> sent to the
# owner on Telegram. Started by the Telegram helper when a pack is complete, or by hand with the story id.
on:
  workflow_dispatch:
    inputs:
      story:
        description: "story id (reels/data/talk.json, assets/motion/<id>)"
        required: true
permissions:
  contents: write
concurrency:
  group: story-${{ inputs.story }}
  cancel-in-progress: false
env:
  STORY: ${{ inputs.story }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      languagetool:
        image: erikvl87/languagetool:latest
        ports: ["8010:8010"]
    outputs:
      clips: ${{ steps.c.outputs.clips }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          case "$STORY" in *[!a-z0-9-]*|"") echo "::error::bad story id"; exit 1;; esac
          python3 - <<'EOF'
          import json, os, sys
          sid = os.environ["STORY"]
          t = [x for x in json.load(open("reels/data/talk.json"))["talks"] if x["id"] == sid]
          if not t: sys.exit(f"::error::{sid} is not in talk.json")
          EOF
          n=$(ls assets/motion/$STORY/in*.mp4 | wc -l); [ "$n" -ge 1 ] || { echo "::error::no clips"; exit 1; }
          echo "clips=$(seq -s, 1 $n | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"
      - name: English check (LanguageTool, British English)
        env:
          LT_URL: http://localhost:8010/v2/check
          ONLY: talk:${{ inputs.story }}/
        run: |
          for k in $(seq 1 30); do curl -s localhost:8010/v2/languages >/dev/null && break; sleep 3; done
          python qc/check_english.py

  voice:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null && pip install -q "edge-tts>=7.0" "faster-whisper>=1.1"
      - run: python tools/story_voice.py "$STORY"
      - name: Listen to every sentence
        run: python tools/story_listen.py "$STORY"
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: assets/talk/${{ inputs.story }}
          retention-days: 3

  sharpen:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJson(needs.check.outputs.clips) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q spandrel pillow numpy scenedetect opencv-python-headless
          mkdir -p weights
          curl -sSLf -o weights/realesr-animevideov3.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-animevideov3.pth
      - name: Keep only the clean part of the clip
        run: python tools/clip_guard.py "assets/motion/$STORY/in${{ matrix.n }}.mp4" clean.mp4
      - name: Smooth (48 fps) and sharp (4K width)
        run: python tools/upscale_video.py clean.mp4 "out-$STORY-${{ matrix.n }}.mp4" --fps 48
      - uses: actions/upload-artifact@v4
        with:
          name: clip-${{ matrix.n }}
          path: out-${{ inputs.story }}-${{ matrix.n }}.mp4
          retention-days: 3

  render:
    needs: [voice, sharpen]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHROME_PATH: /usr/bin/google-chrome
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null && npm ci --no-audit --no-fund && pip install -q pillow numpy
      - uses: actions/download-artifact@v4
        with:
          name: voice
          path: assets/talk/${{ inputs.story }}
      - uses: actions/download-artifact@v4
        with:
          pattern: clip-*
          path: assets/motion/${{ inputs.story }}
          merge-multiple: true
      - name: Render
        run: python reels/render_motion.py "$STORY"
      - name: Check the reel
        run: python tools/check_reel.py "../../outputs/english-reels-samples/motion-$STORY.mp4"
      - name: Phone copy
        run: |
          f=../../outputs/english-reels-samples/motion-$STORY
          ffmpeg -v error -y -i $f.mp4 -vf scale=1080:1920 -c:v libx264 -preset medium -crf 23 -profile:v high -level 4.1 -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart $f-phone.mp4
          mkdir -p reel-out && cp $f.mp4 $f-phone.mp4 $f-cover.jpg reel-out/
      - name: Keep the voice and the finished reel
        run: |
          git config user.name 98torosyan; git config user.email 98torosyan@gmail.com
          python3 - <<'EOF'
          import json, os, datetime
          from pathlib import Path
          sid = os.environ["STORY"]; p = Path("reels/data/stories_ready.json")
          items = json.loads(p.read_text()) if p.exists() else []
          title = next(x["title"] for x in json.load(open("reels/data/talk.json"))["talks"] if x["id"] == sid)
          items = [x for x in items if x["id"] != sid] + [{"id": sid, "title": title, "date": datetime.date.today().isoformat(), "status": "held"}]
          p.write_text(json.dumps(items, ensure_ascii=False, indent=1) + "\n")
          EOF
          git add "assets/talk/$STORY" reels/data/stories_ready.json
          git commit -qm "Պատմություն՝ $STORY (ձայն, պատրաստ)" || true
          for k in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
          o=../../outputs/english-reels-samples
          mkdir -p /tmp/mc && cp $o/motion-$STORY.mp4 $o/motion-$STORY-cover.jpg assets/motion/$STORY/out-*.mp4 /tmp/mc/
          git fetch -q origin motion-clips && git checkout -q -B motion-clips origin/motion-clips
          mkdir -p finished "$STORY" && cp /tmp/mc/motion-$STORY.mp4 /tmp/mc/motion-$STORY-cover.jpg finished/ && cp /tmp/mc/out-*.mp4 "$STORY"/
          git add finished "$STORY" && git commit -qm "Պատրաստ՝ $STORY (չհրապարակված)" || true
          for k in 1 2 3 4 5; do git push -q origin motion-clips && break; sleep 5; git pull -q --rebase origin motion-clips; done
      - name: Send to the owner
        if: env.TG_BOT_TOKEN != ''
        run: |
          git checkout -q main
          python tools/telegram_bot.py video "../../outputs/english-reels-samples/motion-$STORY-phone.mp4" "Պատրաստ է ✅ Պահված է, ու կհրապարակվի, երբ ասես։"
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: reel-out
          retention-days: 7

  failed:
    needs: [check, voice, sharpen, render]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tell the owner
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ -n "$TG_BOT_TOKEN" ] || exit 0
          python tools/telegram_bot.py send "Չստացվեց պատրաստել «$STORY»-ը 😕 Պատճառը GitHub-ում է՝ ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
