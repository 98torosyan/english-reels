name: Sharpen motion clips
on:
  push:
    branches: [main]
    paths: ["assets/motion/*/in*.mp4"]
  workflow_dispatch:
    inputs:
      story:
        description: "folder in assets/motion"
        required: false
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      clips: ${{ steps.l.outputs.clips }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: l
        run: |
          if [ -n "${{ github.event.inputs.story }}" ]; then files=$(ls assets/motion/${{ github.event.inputs.story }}/in*.mp4)
          else files=$(git diff --name-only HEAD~1 HEAD -- 'assets/motion/*/in*.mp4'); fi
          echo "clips=$(printf '%s\n' $files | python3 -c 'import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')" >> "$GITHUB_OUTPUT"
  sharpen:
    needs: list
    if: needs.list.outputs.clips != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        clip: ${{ fromJson(needs.list.outputs.clips) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q spandrel pillow numpy
          mkdir -p weights
          curl -sSLf -o weights/realesr-animevideov3.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-animevideov3.pth
      - id: n
        run: echo "name=$(echo '${{ matrix.clip }}' | sed 's#assets/motion/##; s#/in#-#; s#\.mp4##')" >> "$GITHUB_OUTPUT"
      - run: python tools/upscale_video.py "${{ matrix.clip }}" "out-${{ steps.n.outputs.name }}.mp4"
      - name: Keep the sharpened clip on the motion-clips branch
        run: |
          f="out-${{ steps.n.outputs.name }}.mp4"; story=$(dirname "${{ matrix.clip }}" | xargs basename)
          git config user.name 98torosyan; git config user.email 98torosyan@gmail.com
          mv "$f" /tmp/"$f"
          git fetch -q origin motion-clips && git checkout -q -B motion-clips origin/motion-clips || { git checkout -q --orphan motion-clips && git rm -rqf . ; }
          mkdir -p "$story" && cp /tmp/"$f" "$story/$f" && git add "$story/$f" && git commit -qm "$story: $f"
          for k in 1 2 3 4 5 6 7 8; do git push -q origin motion-clips && break; sleep $((RANDOM % 9 + 3)); git fetch -q origin motion-clips && git rebase -q origin/motion-clips; done
