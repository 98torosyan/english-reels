name: Analytics
on:
  schedule:
    - cron: "23 4 * * *"   # every morning, 08:23 Yerevan
  workflow_dispatch:
    inputs:
      report:
        description: "Also write the weekly report"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: analytics
jobs:
  insights:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot (and Monday report)
        run: |
          if [ "$(TZ=Asia/Yerevan date +%u)" = "1" ] || [ "${{ inputs.report }}" = "true" ]; then python analytics/insights.py --report; else python analytics/insights.py; fi
      - name: Open the weekly report as an issue
        if: hashFiles('analytics/report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Շաբաթական հաշվետվություն · $(TZ=Asia/Yerevan date +%Y-%m-%d)" --body-file analytics/report.md
      - name: Save snapshot
        run: |
          rm -f analytics/report.md
          git add analytics/snapshots
          if ! git diff --cached --quiet; then
            git config user.name 98torosyan; git config user.email 98torosyan@gmail.com
            git commit -m "Վիճակագրություն $(TZ=Asia/Yerevan date +%Y-%m-%d)"
            for k in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 7; done
          fi
