name: Voice test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng ffmpeg >/dev/null && pip install -q "kokoro>=0.9.4" soundfile "misaki[en]" edge-tts
      - run: python voices/kokoro_test.py
      - run: edge-tts --voice en-GB-SoniaNeural --rate=-10% --text "Excuse me, is this seat free? Yes, of course. Please, sit down. Passport, ticket, luggage." --write-media assets/voice-test/edge-sonia.mp3
      - name: Save
        run: |
          for f in assets/voice-test/*.wav; do ffmpeg -v error -y -i "$f" -b:a 128k "${f%.wav}.mp3" && rm "$f"; done
          git add assets/voice-test
          git config user.name 98torosyan; git config user.email 98torosyan@gmail.com
          git commit -m "Ձայների համեմատություն" && git pull --rebase && git push
