name: Voice samples
on:
  push:
    branches: [voice-samples]
    paths: [tools/voice_wer.py]
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null
      - run: pip install -q "faster-whisper>=1.1" && python tools/voice_wer.py
