name: Voice catalogue
on: workflow_dispatch
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng ffmpeg >/dev/null && pip install -q "kokoro>=0.9.4" soundfile "misaki[en]" edge-tts piper-tts
      - run: python voices/voice_catalogue.py
      - name: Save
        run: |
          git add assets/voice-test/catalogue
          git config user.name 98torosyan; git config user.email 98torosyan@gmail.com
          git commit -m "Ձայների կատալոգ" && for k in 1 2 3; do git pull --rebase && git push && break; done
