name: Render ahead
# Every night: renders the posts due in the next 3 days that are not on the media site yet (tools/render_ahead.py),
# then removes the files of posts published more than 3 days ago (tools/prune_media.py), so the site stays small.
# Needs the secret MEDIA_TOKEN (write access to english-reels-media only).
on:
  schedule:
    - cron: "17 22 * * *"   # 02:17 in Yerevan
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: item ids to render now, space-separated"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - name: Check the media token
        env:
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: if [ -z "$MEDIA_TOKEN" ]; then echo "::error::Secret MEDIA_TOKEN is missing (token with write access to english-reels-media)"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          repository: 98torosyan/english-reels-media
          ref: media
          path: media
          token: ${{ secrets.MEDIA_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null && npm ci --no-audit --no-fund && pip install -q pillow numpy
      - name: Render what is due soon
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python tools/render_ahead.py --media-repo media --only $ONLY; else python tools/render_ahead.py --media-repo media --days 3; fi
          python tools/prune_media.py --media-repo media --days 3
      - name: Save media
        working-directory: media
        run: |
          git config user.name 98torosyan; git config user.email 98torosyan@gmail.com
          git add -A
          if ! git diff --cached --quiet; then git commit -qm "Մոտակա օրերի տեսանյութերը (ամպում ռենդեր)"; git push; fi
