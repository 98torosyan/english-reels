name: Watchdog
on:
  schedule:
    - cron: "50 7,10,13,16,19 * * *"   # 11:50 … 23:50 Yerevan
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: watchdog
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find late posts, YouTube gaps, missing media, failed runs; check the token
        id: w
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python publish/watchdog.py || echo "late=1" >> "$GITHUB_OUTPUT"
      - name: Open an issue (GitHub e-mails the owner)
        if: steps.w.outputs.late == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Էջի պահակ · ուշադրություն · $(TZ=Asia/Yerevan date +%Y-%m-%d)"
          if ! gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
            gh issue create --title "$title" --body-file watchdog.md
          fi
