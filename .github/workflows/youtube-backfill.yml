name: YouTube backfill

# Older reading reels go to YouTube two a day (each upload costs 1,600 of the 10,000 daily API units;
# the two new readings of the day are posted by the publisher itself).
on:
  schedule:
    - cron: "17 14 * * *"   # 18:17 Yerevan
  push:
    branches: [main]
    paths: ["publish/YOUTUBE_BACKFILL"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the latest queue
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upload the next two listed reels
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PER_RUN: "2"
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "publish")
          import crosspost
          ids = [l.strip() for l in open("publish/YOUTUBE_BACKFILL") if l.strip() and not l.startswith("#")]
          q = json.load(open("queue.json"))
          left = int(os.environ["PER_RUN"])
          for rid in ids:
              item = next((i for i in q["items"] if i["id"] == rid), None)
              if left <= 0 or not item or not item.get("published_at") or item.get("youtube_id"): continue
              try:
                  got = crosspost.youtube(item)
              except Exception as error:
                  print(rid, "failed:", error); continue
              print(rid, "->", got)
              if got: item["youtube_id"] = got; left -= 1
          json.dump(q, open("queue.json", "w"), ensure_ascii=False, indent=2)
          open("queue.json", "a").write("\n")
          PY
      - name: Save
        run: |
          if ! git diff --quiet queue.json; then
            git config user.name 98torosyan
            git config user.email "$(git log -1 --format=%ae)"
            git commit -m "YouTube: նշել ներբեռնված տեսանյութերը" queue.json
            for k in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 7; done
          fi
