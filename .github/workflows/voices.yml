name: Make voices
on:
  push:
    branches: [main]
    paths: ["assets/lessons/*.lesson.json", "voices/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg >/dev/null && pip install "edge-tts>=7.0"
      - run: python voices/make_voice.py
      - name: Save audio
        run: |
          git add assets/lessons
          if ! git diff --cached --quiet; then
            git config user.name 98torosyan
            git config user.email 98torosyan@gmail.com
            git commit -m "Ավելացնել նոր պատմությունների ձայները"
            git pull --rebase && git push
          fi
