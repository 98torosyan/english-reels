name: Make voices
on:
  push:
    branches: [main]
    paths: ["assets/lessons/*.lesson.json", "reels/data/cards.json", "reels/data/sounds.json", "reels/data/dialogues.json", "reels/data/words10.json", "reels/data/phrasal.json", "reels/data/reading.json", "reels/data/storyvideo.json", "reels/data/routine.json", "reels/data/feelstory.json", "carousels/data/opposites.json", "carousels/data/countries.json", "reels/data/talk.json", "stories/stories.json", "voices/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voices
  cancel-in-progress: false
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null && pip install "edge-tts>=7.0" "kokoro>=0.9.4" soundfile "misaki[en]" && sudo apt-get install -y espeak-ng >/dev/null
      - run: python voices/make_voice.py
      - name: Storyteller voice (Chatterbox) for the clips that use it
        run: |
          if grep -rq '"chatterbox:' reels/data stories 2>/dev/null; then
            pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            pip install -q chatterbox-tts "setuptools<81"
            python -c "import perth; assert perth.PerthImplicitWatermarker is not None, 'watermark module did not load'"
            python voices/make_voice.py
          fi
      - name: Cache alignment model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ctc-aligner-v1
      - name: Studio polish and exact word times
        run: |
          pip install -q pedalboard
          pip install -q "git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git"
          python tools/voice_finish.py --budget 50 || echo "voice finishing skipped this time"
      - name: Save audio
        run: |
          git add assets/lessons assets/cards assets/sounds assets/dialogues assets/stories assets/words10 assets/phrasal assets/reading assets/storyvideo assets/routine assets/feelstory assets/opposites assets/countries assets/talk
          if ! git diff --cached --quiet; then
            git config user.name 98torosyan
            git config user.email 98torosyan@gmail.com
            git commit -m "Ավելացնել նոր պատմությունների ձայները"
            git pull --rebase && git push
          fi
