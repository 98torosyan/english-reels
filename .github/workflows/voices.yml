name: Make voices
on:
  push:
    branches: [main]
    paths: ["assets/lessons/*.lesson.json", "reels/data/cards.json", "reels/data/sounds.json", "reels/data/dialogues.json", "reels/data/words10.json", "reels/data/phrasal.json", "reels/data/reading.json", "reels/data/storyvideo.json", "reels/data/routine.json", "stories/stories.json", "voices/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voices
  cancel-in-progress: false
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null && pip install "edge-tts>=7.0" "kokoro>=0.9.4" soundfile "misaki[en]" && sudo apt-get install -y espeak-ng >/dev/null
      - run: python voices/make_voice.py
      - name: Save audio
        run: |
          git add assets/lessons assets/cards assets/sounds assets/dialogues assets/stories assets/words10 assets/phrasal assets/reading assets/storyvideo assets/routine
          if ! git diff --cached --quiet; then
            git config user.name 98torosyan
            git config user.email 98torosyan@gmail.com
            git commit -m "Ավելացնել նոր պատմությունների ձայները"
            git pull --rebase && git push
          fi
