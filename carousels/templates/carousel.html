<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1350,initial-scale=1">
  <link rel="icon" href="data:,">
  <style>
    @font-face{font-family:Inter;src:url("__INTER_FONT__") format("woff2");font-style:normal;font-weight:100 900;font-display:block}
    @font-face{font-family:Literata;src:url("__LITERATA_FONT__") format("woff2");font-style:normal;font-weight:100 900;font-display:block}
    @font-face{font-family:NotoArmenian;src:url("__ARMENIAN_FONT__") format("woff2");font-style:normal;font-weight:100 900;font-display:block}
    *{box-sizing:border-box;margin:0}
    html,body{width:1080px;height:1350px;overflow:hidden;background:#17183A;color:#fff;font-family:Inter,sans-serif}
    body{position:relative;background:radial-gradient(780px 580px at 90% 0%,#6A49E288,transparent 70%),radial-gradient(650px 650px at -5% 82%,#5A3B8C88,transparent 70%),linear-gradient(160deg,#17183A 0%,#2A1E4D 60%,#17183A 100%)}
    .grain{position:absolute;inset:0;opacity:.1;background-image:radial-gradient(#fff .6px,transparent .6px);background-size:8px 8px;mask-image:linear-gradient(180deg,transparent,#000 22%,#000 85%,transparent)}
    .header{position:absolute;top:58px;left:76px;right:76px;display:flex;align-items:center;gap:20px}
    .logo{width:82px;height:82px;border-radius:23px;box-shadow:0 10px 28px #08061577}
    .brand-name{font:700 31px/1.12 Literata,serif;letter-spacing:-.4px}
    .brand-sub{margin-top:6px;color:#A891F7;font-size:15px;font-weight:800;letter-spacing:4.2px}
    .rainbow{position:absolute;top:168px;left:78px;display:flex;gap:7px}
    .rainbow i{display:block;width:34px;height:7px;border-radius:8px}
    .chip{position:absolute;top:207px;right:78px;padding:10px 18px;border:1.5px solid #A891F755;border-radius:99px;background:#ffffff10;color:#E9C46A;font-size:17px;font-weight:800;letter-spacing:2px}
    .series{position:absolute;top:263px;left:78px;color:#A891F7;font-size:19px;font-weight:800;letter-spacing:5px}
    h1{position:absolute;top:316px;left:78px;right:78px;font:700 62px/1.08 Literata,serif;letter-spacing:-1px}
    h1 em{font-style:italic;color:#E9C46A}
    .card{position:absolute;left:58px;right:58px;top:492px;min-height:590px;padding:48px 52px;border:1.5px solid #A891F755;border-radius:36px;background:linear-gradient(155deg,#6A49E233,#ffffff0a 60%);box-shadow:0 24px 62px #07061577}
    .card-label{font-family:Inter,sans-serif;font-size:18px;font-weight:800;letter-spacing:4px;color:#A891F7;text-transform:uppercase}
    .card-label-hy{font-family:NotoArmenian,sans-serif;font-size:.95em;font-weight:700;letter-spacing:0;text-transform:none}
    .body-en{margin-top:26px;font:600 40px/1.3 Literata,serif;overflow-wrap:anywhere}
    .body-hy{margin-top:24px;font:500 31px/1.45 NotoArmenian,sans-serif;color:#E4DEFA;overflow-wrap:anywhere}
    .pattern{margin-top:26px;padding:22px 26px;border-radius:24px;background:#ffffff0d;border:1px solid #ffffff20;font:700 31px/1.35 Inter,sans-serif;color:#F2C86B;overflow-wrap:anywhere}
    .wrong{margin-top:22px;padding:18px 22px;border-radius:21px;background:#B23F781f;border:1.5px solid #B23F7899;color:#F3DCE7;font:600 29px/1.32 Literata,serif;overflow-wrap:anywhere}
    .right{margin-top:17px;padding:18px 22px;border-radius:21px;background:#2E9E6A1c;border:1.5px solid #2E9E6A88;color:#E8FFF3;font:600 29px/1.32 Literata,serif;overflow-wrap:anywhere}
    .practice{margin-top:29px;font:600 31px/1.36 Literata,serif}
    .answer{margin-top:14px;color:#E9C46A;font:700 24px/1.35 Inter,sans-serif}
    .save-panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(620px 540px at 50% 40%,#6A49E2,#2A1E4D 58%,#17183A 86%)}
    .save-panel img{width:154px;height:154px;border-radius:39px;box-shadow:0 18px 48px #0009}
    .save-panel h2{margin-top:34px;font:700 70px/1.08 Literata,serif}
    .save-panel h2 em{color:#E9C46A}
    .save-panel p{margin-top:18px;color:#E4DEFA;font:500 29px/1.45 NotoArmenian,sans-serif;max-width:800px}
    .save-panel .pill{margin-top:36px;padding:15px 28px;border-radius:99px;background:#E9C46A;color:#17183A;font-size:25px;font-weight:800}
    #save[hidden]{display:none}
    .opt{margin-top:22px;padding:22px 28px;border-radius:22px;background:#ffffff0d;border:1.5px solid #A891F755;font:600 38px/1.25 Literata,serif}
    .opt b{display:inline-block;width:56px;color:#E9C46A;font-family:Inter,sans-serif}
    .hint{margin-top:30px;color:#A891F7;font:700 22px Inter,sans-serif;letter-spacing:2px}
    .ans{padding:20px 6px;border-bottom:1.5px solid #A891F733;font:600 38px/1.2 Literata,serif}
    .ans:last-child{border:0}
    .big-num{font:700 220px/1 Literata,serif;color:#E9C46A}
    .swipe{margin-top:40px;display:inline-block;padding:14px 26px;border-radius:99px;background:#E9C46A;color:#17183A;font:800 26px Inter,sans-serif}
    .item-num{font:800 24px Inter,sans-serif;letter-spacing:5px;color:#A891F7}
    .item-en{margin-top:18px;font:700 66px/1.12 Literata,serif;color:#E9C46A}
    .item-hy{margin-top:16px;font:600 40px/1.35 NotoArmenian,sans-serif;color:#fff}
    .item-ex{margin-top:40px;padding-top:30px;border-top:1.5px solid #A891F744;font:500 38px/1.38 Literata,serif;font-style:italic}
    .footer{position:absolute;left:78px;right:78px;bottom:53px;display:flex;justify-content:space-between;align-items:center;color:#C9C2E3;font-size:17px;font-weight:700}
    .footer .brand{color:#A891F7;letter-spacing:2.6px;font-weight:800}
    .page{position:absolute;right:78px;top:463px;color:#C9C2E3;font-size:17px;font-weight:700;letter-spacing:2px}
  </style>
</head>
<body>
  
  <header class="header"><img class="logo" src="__LOGO_DATA__" alt=""><div><div class="brand-name">Gayane Torosyan</div><div class="brand-sub">ENGLISH READING ROOM</div></div></header>
  <div class="rainbow"><i style="background:#B23F78"></i><i style="background:#7A4FD6"></i><i style="background:#3E5FD9"></i><i style="background:#1C8AA3"></i><i style="background:#2E9E6A"></i><i style="background:#E8A317"></i></div>
  <div id="chip" class="chip">A1–B1 · GRAMMAR</div>
  <div id="series" class="series">GRAMMAR MADE CLEAR</div>
  <h1 id="title"></h1>
  <div id="page" class="page"></div>
  <main id="card" class="card"></main>
  <section id="save" class="save-panel" hidden><img src="__LOGO_DATA__" alt=""><h2>Read · Learn · <em>Remember</em></h2><p id="save-hy"></p><span class="pill">Save 📌</span></section>
  <footer class="footer"><span>Let's read together</span><span class="brand">@english.readingroom</span></footer>
  <script>
    window.setSlide=data=>{
      document.getElementById('chip').textContent=data.level;
      document.getElementById('series').textContent=data.series;
      document.getElementById('title').innerHTML=data.title;
      document.getElementById('page').textContent=`${String(data.index+1).padStart(2,'0')} / ${String(data.total).padStart(2,'0')}`;
      const card=document.getElementById('card');
      const hy=`<div class="body-hy">${data.rule}</div>`;
      if(data.kind==='hook') card.innerHTML=`<div class="card-label">ONE CLEAR RULE · <span class="card-label-hy">Մեկ հստակ կանոն</span></div><div class="body-en">${data.example}</div>${hy}<div class="pattern">${data.pattern}</div>`;
      if(data.kind==='rule') card.innerHTML=`<div class="card-label">THE RULE · <span class="card-label-hy">Կանոնը</span></div><div class="body-hy" style="margin-top:34px;font-size:38px">${data.rule}</div><div class="pattern">${data.pattern}</div>`;
      if(data.kind==='pattern') card.innerHTML=`<div class="card-label">BUILD THE SENTENCE · <span class="card-label-hy">Կառուցիր նախադասությունը</span></div><div class="pattern" style="margin-top:34px;font-size:37px">${data.pattern}</div><div class="body-hy">${data.rule}</div>`;
      if(data.kind==='example') card.innerHTML=`<div class="card-label">EXAMPLE · <span class="card-label-hy">Օրինակ</span></div><div class="body-en" style="font-size:46px">${data.example}</div><div class="body-hy">${data.example_hy}</div><div class="pattern">${data.pattern}</div>`;
      if(data.kind==='mistake') card.innerHTML=`<div class="card-label">SPOT THE SLIP · <span class="card-label-hy">Գտիր սխալը</span></div><div class="wrong">✕ &nbsp;${data.wrong}</div><div class="right">✓ &nbsp;${data.fix}</div><div class="body-hy">${data.rule}</div>`;
      if(data.kind==='practice') card.innerHTML=`<div class="card-label">YOUR TURN · <span class="card-label-hy">Քո հերթն է</span></div><div class="practice">${data.practice}</div><div class="answer">ANSWER · ${data.answer}</div><div class="body-hy">${data.rule}</div>`;
      if(data.kind==='listhook') card.innerHTML=`<div class="big-num">${data.count}</div><div class="body-hy" style="font-size:38px;margin-top:10px">${data.subtitle}</div><div class="swipe">Swipe →</div>`;
      if(data.kind==='item') card.innerHTML=`<div class="item-num">${String(data.num).padStart(2,'0')}</div><div class="item-en">${data.en}</div><div class="item-hy">${data.hy}</div><div class="item-ex">“${data.example}”</div><div class="body-hy" style="font-size:30px">${data.example_hy}</div>`;
      if(data.kind==='testhook') card.innerHTML=`<div class="big-num">${data.count}</div><div class="item-hy" style="font-size:36px;margin-top:6px">${data.subtitle}</div><div class="swipe">Start →</div>`;
      if(data.kind==='q') card.innerHTML=`<div class="item-ex" style="margin-top:0;padding-top:0;border:0;font-style:normal;font-weight:600;font-size:48px">${data.q}</div>${data.opts.map((o,i)=>`<div class="opt"><b>${String.fromCharCode(65+i)}</b>${o}</div>`).join('')}<div class="hint">Remember your answer · Հիշի՛ր պատասխանդ</div>`;
      if(data.kind==='answers') card.innerHTML=data.answers.map(a=>`<div class="ans">${a}</div>`).join('');
      if(data.kind==='item'||data.kind==='listhook') document.getElementById('title').innerHTML=data.kind==='item'?data.title:data.title;
      if(data.kind==='save'){
        card.hidden=true; document.getElementById('save').hidden=false;
        document.getElementById('save-hy').textContent=data.rule;
      }else{
        card.hidden=false; document.getElementById('save').hidden=true;
      }
    };
  </script>
</body>
</html>
