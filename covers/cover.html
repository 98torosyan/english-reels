<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lit;src:url("__LITERATA_FONT__") format("woff2");font-weight:100 900}
@font-face{font-family:Lit;src:url("__LITERATA_ITALIC__") format("woff2");font-weight:100 900;font-style:italic}
@font-face{font-family:Inter;src:url("__INTER_FONT__") format("woff2");font-weight:100 900}
@font-face{font-family:IPA;src:url("__INTER_FONT__") format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:IPA;src:url("__INTER_EXT__") format("woff2");unicode-range:U+0100-02FF}
@font-face{font-family:IPA;src:url("__INTER_GREEK__") format("woff2");unicode-range:U+0370-03FF}
@font-face{font-family:Arm;src:url("__ARMENIAN_FONT__") format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}
:root{--ink:#17183A;--muted:#5A5770;--soft:#8C89A0;--line:#17183A24;--card:#FFFCF6}
html,body{width:1080px;height:var(--h);overflow:hidden}
body{position:relative;color:var(--ink);font-family:Lit,serif;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>"),
 radial-gradient(900px 700px at 85% 10%,#FFFDF7,transparent 70%),linear-gradient(170deg,#F7F2E8,#EFE8DA)}
body:before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;background:var(--c)}
.tile{position:absolute;left:0;right:0;top:var(--top);height:var(--th);padding:110px 100px}
.topline{display:flex;justify-content:space-between;align-items:center;font:800 25px Inter;letter-spacing:6px;color:#6B6880}
.topline b{color:var(--c);display:flex;align-items:center;gap:14px}.topline b:before{content:"";width:16px;height:16px;border-radius:50%;background:var(--c)}
.topline span{font-family:IPA}
.rule{height:3px;background:var(--ink);margin-top:30px}.rule2{height:1px;background:var(--ink);margin-top:6px;opacity:.6}
.foot{position:absolute;left:100px;right:100px;bottom:110px;display:flex;justify-content:space-between;align-items:center}
.foot .b{display:flex;align-items:center;gap:18px;font:800 24px Inter;letter-spacing:4px;color:#6B6880}
.foot img{width:56px;height:56px;border-radius:14px}
.foot .num{font:italic 600 36px Lit;color:var(--c)}
.hy{font-family:Arm;color:var(--muted)}
.cap{font:800 24px Inter;letter-spacing:5px;color:var(--soft)}
i{font-style:italic}
.c{color:var(--c)}

/* WORD: dictionary entry with a thumb-index tab */
.word .tab{position:absolute;right:0;top:330px;width:130px;height:230px;background:var(--c);color:#fff;border-radius:22px 0 0 22px;display:flex;align-items:center;justify-content:center;font:700 120px Lit}
.word h1{margin-top:150px;font:700 210px/1 Lit;letter-spacing:-4px}
.word .pos{margin-top:34px;font:italic 500 52px Lit;color:var(--muted)}
.word .tr{margin-top:56px;padding-top:40px;border-top:1px solid var(--line);font-size:60px;color:var(--ink)}
.word .ex{margin-top:26px;font:italic 500 44px/1.35 Lit;color:#3A3A52}

/* DIALOGUE: a script page with a large quotation mark */
.dlg .q{position:absolute;right:60px;bottom:120px;font:700 640px/.6 Lit;color:var(--c);opacity:.12}
.dlg h1{margin-top:120px;font:700 128px/1.02 Lit;letter-spacing:-2px}
.dlg h1 i{color:var(--c)}
.dlg .hy.t{margin-top:20px;font-size:42px}
.dlg .script{margin-top:80px;display:grid;grid-template-columns:110px 1fr;row-gap:30px;align-items:baseline}
.dlg .script b{font:800 24px Inter;letter-spacing:4px;color:var(--soft)}
.dlg .script b.me{color:var(--c)}
.dlg .script div{font:500 48px/1.3 Lit}
.dlg .script div.me{color:var(--soft);font-style:italic}

/* SOUND: split page, two words facing each other */
.snd .ask{margin-top:110px;font:700 74px/1.1 Lit}
.snd .ask i{color:var(--c)}
.snd .pair{margin-top:90px;display:grid;grid-template-columns:1fr 3px 1fr;align-items:center;text-align:center}
.snd .pair .bar{height:420px;background:var(--c);opacity:.6}
.snd .pair b{display:block;font:700 150px/1 Lit}
.snd .pair .ipa{margin-top:24px;font:500 52px IPA;color:var(--c)}
.snd .pair .hy{margin-top:20px;font-size:42px}
.snd .ab{display:block;font:800 26px Inter;letter-spacing:5px;color:var(--soft);margin-bottom:26px}

/* MISTAKE: proofreader's marks */
.mis h1{margin-top:120px;font:700 112px/1.04 Lit;letter-spacing:-2px}
.mis h1 i{color:var(--c)}
.mis .proof{margin-top:110px;position:relative;font:500 64px/1.5 Lit}
.mis .proof s{text-decoration-color:#B23F78;text-decoration-thickness:5px}
.mis .proof .fix{position:absolute;transform:translate(-10%,-92%);font:italic 600 58px Lit;color:var(--c);white-space:nowrap}
.mis .proof .fix:after{content:"";position:absolute;left:30%;bottom:-18px;width:26px;height:26px;border-left:4px solid var(--c);border-bottom:4px solid var(--c);transform:rotate(-45deg)}
.mis .hy{margin-top:60px;font-size:42px}

/* QUIZ: exam paper */
.qz .timer{position:absolute;right:100px;top:300px;width:170px;height:170px;border-radius:50%;border:8px solid var(--c);display:flex;align-items:center;justify-content:center;font:700 96px Lit;color:var(--c)}
.qz h1{margin-top:110px;font:700 100px/1.05 Lit;letter-spacing:-1px;max-width:700px}
.qz .qst{margin-top:80px;font:600 62px/1.3 Lit}
.qz .opts{margin-top:46px;display:grid;gap:22px}
.qz .opts div{display:flex;align-items:center;gap:30px;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:22px 32px;font:500 52px Lit}
.qz .opts b{width:56px;height:56px;border-radius:12px;border:3px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;font:800 28px Inter}

/* STORY: a centred book page */
.sty{text-align:center}
.sty .chap{margin-top:150px;font:800 28px Inter;letter-spacing:10px;color:var(--c)}
.sty .orn{margin:40px auto 0;width:300px;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent)}
.sty h1{margin-top:60px;font:700 140px/1.02 Lit;letter-spacing:-2px}
.sty h1 i{color:var(--c)}
.sty .open{margin:90px auto 0;max-width:820px;text-align:left;font:500 50px/1.5 Lit;color:#2A2840}
.sty .open:first-letter{float:left;font:700 170px/.8 Lit;color:var(--c);margin:14px 20px 0 0}
.sty .page{margin-top:60px;font:italic 500 38px Lit;color:var(--soft)}

/* GLOSSARY (collocations, new words): a big key word and an index */
.glo .key{margin-top:110px;font:700 230px/.95 Lit;letter-spacing:-6px;color:var(--c)}
.glo .kt{margin-top:20px;font:600 56px/1.15 Lit}
.glo .idx{margin-top:70px;columns:2;column-gap:60px;font:500 46px/1.75 Lit}
.glo .idx div{break-inside:avoid;border-bottom:1px solid var(--line)}
.glo .hy{margin-top:40px;font-size:40px}

/* SAY IT NATURALLY: instead of ... try */
.say h1{margin-top:110px;font:700 112px/1.05 Lit;letter-spacing:-2px}
.say h1 i{color:var(--c)}
.say .alts{margin-top:80px;display:grid;gap:26px}
.say .alts div{font:500 54px Lit;padding-left:40px;border-left:6px solid var(--c)}
.say .hy{margin-top:56px;font-size:40px}

/* GRAMMAR RULE: the formula in a box */
.rul h1{margin-top:110px;font:700 108px/1.05 Lit;letter-spacing:-2px}
.rul h1 i{color:var(--c)}
.rul .box{margin-top:80px;border:3px solid var(--c);border-radius:24px;padding:44px 48px;background:var(--card);font:600 48px/1.4 IPA;color:var(--ink)}
.rul .box small{display:block;font:800 22px Inter;letter-spacing:5px;color:var(--c);margin-bottom:18px}
.rul .hy{margin-top:50px;font-size:40px}

/* UFAR TEST: exam sheet */
.ufr h1{margin-top:110px;font:700 120px/1.02 Lit;letter-spacing:-2px}
.ufr h1 i{color:var(--c)}
.ufr .sheet{margin-top:80px;display:grid;gap:40px;font:500 46px Lit;color:var(--muted)}
.ufr .sheet div{display:flex;gap:20px;align-items:flex-end}
.ufr .sheet div span{flex:1;border-bottom:2px solid var(--ink);opacity:.5;height:46px}
.ufr .hy{margin-top:60px;font-size:42px}
</style></head><body>
<div class="tile" id="tile"><div class="topline"><b id="label"></b><span id="right"></span></div><div class="rule"></div><div class="rule2"></div>
<div id="body"></div>
<div class="foot"><div class="b"><img src="__LOGO_DATA__">ENGLISH READING ROOM</div><div class="num" id="num"></div></div></div>
<script>
window.render=s=>{const r=document.documentElement.style;r.setProperty('--c',s.c);r.setProperty('--h',s.h+'px');
 r.setProperty('--top',Math.max(0,(s.h-1440)/2)+'px');r.setProperty('--th',Math.min(1440,s.h)+'px');
 document.getElementById('tile').className='tile '+s.layout;
 label.textContent=s.label;right.textContent=s.right||'';num.textContent=s.num||'';
 document.getElementById('body').innerHTML=s.body;
 // fit: shrink any element marked data-fit until it fits the width
 for(const el of document.querySelectorAll('[data-fit]')){let fs=parseFloat(getComputedStyle(el).fontSize);
  while(el.scrollWidth>el.clientWidth+1&&fs>40){fs-=4;el.style.fontSize=fs+'px';}}
 // keep the body above the footer
 const body=document.getElementById('body'),foot=document.querySelector('.foot').getBoundingClientRect().top;
 let k=1;while(body.getBoundingClientRect().bottom>foot-40&&k>.6){k-=.04;body.style.zoom=k;}
};
</script></body></html>
